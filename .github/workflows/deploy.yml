name: Deploy web apps to GitHub Pages

# Builds both browser apps and publishes them to GitHub Pages:
#   https://<user>.github.io/Tech/             → Inside the Sip (WebXR)
#   https://<user>.github.io/Tech/clip-forge/  → Clip Forge (3D video ad maker)
#   https://<user>.github.io/Tech/gym-accountability/ → Ironclad (gym accountability, static)
on:
  push:
    branches: [claude/wizardly-noether-ji4obu, claude/video-clip-app-g3e6sg, ccr-c7cbb14b-l69v7c, ccr-6d9d710c-9v3uwl, ccr-a58c1c67-42ptz2]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build Inside the Sip
        working-directory: inside-the-sip
        run: |
          npm ci
          npm run build
        env:
          # Served from https://<user>.github.io/Tech/ — must match the repo name.
          VITE_BASE: /Tech/

      - name: Build Clip Forge
        working-directory: clip-forge
        run: |
          npm ci
          npm run build
        env:
          VITE_BASE: /Tech/clip-forge/

      # The Paw Sign app reads venues.json instead of querying OpenStreetMap from
      # each visitor's phone. The list is built once a week from the Geofabrik
      # download of Australia and reused from the cache in between.
      - name: Work out this week's venue list key
        id: week
        run: echo "w=$(date -u +%G-%V)" >> "$GITHUB_OUTPUT"

      - name: Reuse this week's venue list if it was already built
        id: venues-cache
        uses: actions/cache@v4
        with:
          path: |
            venues.json
            venues-nosign.json
          key: dfv-venues-v2-${{ hashFiles('.github/scripts/dfv_venues.py') }}-${{ steps.week.outputs.w }}

      - name: Build the venue list from the weekly OpenStreetMap download
        if: steps.venues-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq osmium-tool
          curl -fL --retry 3 -m 900 -sS -o au.osm.pbf https://download.geofabrik.de/australia-oceania/australia-latest.osm.pbf
          ls -la au.osm.pbf
          osmium tags-filter au.osm.pbf nwr/dog nwr/leisure=dog_park nwr/amenity=cafe,pub,bar,restaurant -o dog.osm.pbf
          osmium export dog.osm.pbf -u type_id -f geojsonseq -x print_record_separator=false -o dog.geojsonseq
          python3 .github/scripts/dfv_venues.py dog.geojsonseq venues.json venues-nosign.json || rm -f venues.json venues-nosign.json
          ls -la venues.json venues-nosign.json
          rm -f au.osm.pbf dog.osm.pbf dog.geojsonseq

      # Last resort only: the public query servers are often at capacity. If
      # this fails too, the site still deploys and the app tries live lookups.
      - name: Fetch Victorian venues with dog-access info from OpenStreetMap
        if: hashFiles('venues.json') == ''
        continue-on-error: true
        run: |
          q='[out:json][timeout:150];area["ISO3166-2"="AU-VIC"]->.v;(nwr["dog"]["name"]["amenity"~"^(cafe|pub|bar|restaurant|biergarten|fast_food|ice_cream)$"](area.v);nwr["dog"]["name"]["shop"](area.v););out center tags;'
          keep='^(name|dog|amenity|shop|outdoor_seating|website|contact:website|email|contact:email|addr:housenumber|addr:street|addr:suburb|addr:city)$'
          for u in https://overpass-api.de/api/interpreter https://overpass.kumi.systems/api/interpreter https://overpass.private.coffee/api/interpreter https://maps.mail.ru/osm/tools/overpass/api/interpreter; do
            echo "Trying $u"
            code=$(curl -sS -m 200 -A "DogFriendlyVictoria-site-build (github.com/techb54321-svg/Tech)" -o raw.json -w '%{http_code}' --data-urlencode "data=$q" "$u" || true)
            echo "HTTP $code, $(wc -c < raw.json 2>/dev/null || echo 0) bytes"
            if [ "$code" = "200" ] && jq -e '.elements | length > 0' raw.json > /dev/null 2>&1; then
              jq -c --arg keep "$keep" '{generated: (now | todate), elements: [.elements[] | {type, id, lat: (.lat // .center.lat), lon: (.lon // .center.lon), tags: (.tags | with_entries(select(.key | test($keep))))}]}' raw.json > venues.json
              echo "Saved $(jq '.elements | length' venues.json) venues from $u"
              jq -r '[.elements[].tags.dog] | group_by(.) | map("\(.[0]): \(length)") | join(", ")' venues.json
              break
            fi
            head -c 300 raw.json 2>/dev/null || true; echo
          done
          [ -s venues.json ] || echo "::warning::No venue list fetched; the app will use live lookups."

      # Shared wish totals for the Wish Map. Needs two repository secrets,
      # CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID; without them the app
      # simply keeps wishes on each device.
      - name: Check for Cloudflare details
        id: cf
        env:
          CF: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACC: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$CF" ] && [ -n "$ACC" ]; then echo "ready=true" >> "$GITHUB_OUTPUT"; else
            echo "::notice::Wish Map server not deployed: add the CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID repository secrets."
            echo "ready=false" >> "$GITHUB_OUTPUT"; fi

      - name: Deploy the Wish Map server
        if: steps.cf.outputs.ready == 'true'
        continue-on-error: true
        working-directory: dfv-wishes
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npm ci --no-audit --no-fund
          npx wrangler deploy | tee deploy.log
          url=$(grep -oE 'https://[a-z0-9.-]+\.workers\.dev' deploy.log | head -1)
          if [ -n "$url" ] && curl -fsS -m 30 "$url/counts" > /dev/null; then
            printf '{"api":"%s"}\n' "$url" > ../wish-config.json
            echo "Wish Map server is answering at $url"
          else
            echo "::warning::Wish Map server deployed but did not answer at '$url'; the app will keep wishes on each device."
          fi

      - name: Assemble site
        run: |
          mkdir -p site
          cp -r inside-the-sip/dist/. site/
          mkdir -p site/clip-forge
          cp -r clip-forge/dist/. site/clip-forge/
          mkdir -p site/gym-accountability
          cp -r gym-accountability/. site/gym-accountability/
          mkdir -p site/ironclad
          cp -r gym-accountability/landing/. site/ironclad/
          mkdir -p site/quiet-table
          cp -r quiet-table/. site/quiet-table/
          mkdir -p site/dog-friendly-victoria
          cp -r dog-friendly-victoria/. site/dog-friendly-victoria/
          if [ -s venues.json ]; then cp venues.json site/dog-friendly-victoria/app/venues.json; fi
          if [ -s venues-nosign.json ]; then cp venues-nosign.json site/dog-friendly-victoria/app/venues-nosign.json; fi
          if [ -s wish-config.json ]; then cp wish-config.json site/dog-friendly-victoria/app/config.json; fi

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
