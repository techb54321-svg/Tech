name: Deploy web apps to GitHub Pages

# Builds both browser apps and publishes them to GitHub Pages:
#   https://<user>.github.io/Tech/             → Inside the Sip (WebXR)
#   https://<user>.github.io/Tech/clip-forge/  → Clip Forge (3D video ad maker)
on:
  push:
    branches: [claude/wizardly-noether-ji4obu, claude/video-clip-app-g3e6sg]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build Inside the Sip
        working-directory: inside-the-sip
        run: |
          npm ci
          npm run build
        env:
          # Served from https://<user>.github.io/Tech/ — must match the repo name.
          VITE_BASE: /Tech/

      - name: Build Clip Forge
        working-directory: clip-forge
        run: |
          npm ci
          npm run build
        env:
          VITE_BASE: /Tech/clip-forge/

      - name: Assemble site
        run: |
          mkdir -p site
          cp -r inside-the-sip/dist/. site/
          mkdir -p site/clip-forge
          cp -r clip-forge/dist/. site/clip-forge/

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
