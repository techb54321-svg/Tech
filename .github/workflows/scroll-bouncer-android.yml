name: Build Scroll Bouncer for Android

# Builds the Android app, then tries it on an emulated phone: opens an app on
# his list and checks that the little guy turns up and sends it away.
# The app file from each run is kept under Artifacts on the run's page.
on:
  push:
    branches: [claude/admiring-franklin-j3e7j5]
    paths:
      - "scroll-bouncer-android/**"
      - "scroll-bouncer/guy.js"
      - ".github/workflows/scroll-bouncer-android.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: scroll-bouncer-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Build and check
        working-directory: scroll-bouncer-android
        run: |
          # Google refuses to install apps from outside the Play Store that ask for any of these.
          if grep -E "BIND_ACCESSIBILITY_SERVICE|BIND_NOTIFICATION_LISTENER_SERVICE|READ_SMS|RECEIVE_SMS" app/src/main/AndroidManifest.xml; then
            echo "The app asks for a permission that Google Play Protect blocks."
            exit 1
          fi
          ./gradlew --no-daemon assembleRelease assembleDebug lintRelease

      - uses: actions/upload-artifact@v4
        with:
          name: scroll-bouncer-android
          path: |
            scroll-bouncer-android/app/build/outputs/apk/release/app-release.apk
            scroll-bouncer-android/app/build/outputs/apk/debug/app-debug.apk

  try-on-a-phone:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: scroll-bouncer-android
          path: apk

      - name: Let the emulator use hardware acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Try it on an emulated phone
        run: |
          python3 -m pip install --quiet pillow
          scroll-bouncer-android/ci/try-on-emulator.sh apk/debug/app-debug.apk apk/release/app-release.apk

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: emulator-screens
          path: |
            shots
            preview
            ui.xml
            log.txt
            emulator.log
          if-no-files-found: ignore
