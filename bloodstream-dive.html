<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Bloodstream Dive</title>
<style>
  html,body{height:100%;}
  body{margin:0; background:#0a0103; overflow:hidden; cursor:default;
    -webkit-user-select:none; user-select:none;
    font-family:system-ui,-apple-system,sans-serif;}
  #stage{position:fixed; inset:0;}
  #stage canvas{display:block; width:100%; height:100%;}
  body.hidecursor{cursor:none;}
  #fallback{position:fixed; inset:0; z-index:20; display:none; flex-direction:column;
    align-items:center; justify-content:center; gap:1rem; text-align:center;
    background:#0a0103; padding:0 8vw; color:rgba(240,225,215,.6); font-weight:300;}
</style>
</head>
<body>
<div id="stage"></div>
<div id="fallback">
  <p>The 3D engine could not load — this page needs an internet connection the
    first time it opens. Reload once you're online.</p>
</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.134.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.134.0/examples/js/postprocessing/Pass.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.134.0/examples/js/shaders/CopyShader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.134.0/examples/js/shaders/LuminosityHighPassShader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.134.0/examples/js/postprocessing/EffectComposer.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.134.0/examples/js/postprocessing/RenderPass.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.134.0/examples/js/postprocessing/ShaderPass.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.134.0/examples/js/postprocessing/UnrealBloomPass.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.134.0/examples/js/shaders/BokehShader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.134.0/examples/js/postprocessing/BokehPass.js"></script>
<script>
(function(){
'use strict';
if(!window.THREE){ document.getElementById('fallback').style.display='flex'; return; }

var reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
var isSmall = Math.min(window.innerWidth, window.innerHeight) < 700 ||
              ((navigator.maxTouchPoints||0) > 0 && (window.devicePixelRatio||1) >= 2);

var COUNTS = {
  cells:     isSmall ? 400 : 1100,
  platelets: isSmall ? 60  : 150,
  micro:     isSmall ? 420 : 1500,
  bokeh:     isSmall ? 10  : 22
};

// ---------- renderer ----------
var postOK = !!(THREE.EffectComposer && THREE.RenderPass && THREE.ShaderPass &&
                THREE.UnrealBloomPass && THREE.LuminosityHighPassShader && THREE.CopyShader);
var renderer;
try{
  // MSAA only helps the no-post path; the composer path never multisamples the scene
  renderer = new THREE.WebGLRenderer({antialias:!postOK, powerPreference:'high-performance'});
}catch(e){ document.getElementById('fallback').style.display='flex'; return; }
renderer.setPixelRatio(Math.min(window.devicePixelRatio||1, 1.5));
renderer.setSize(window.innerWidth, window.innerHeight);
document.getElementById('stage').appendChild(renderer.domElement);
if(postOK){
  // stay linear until the final grade pass does ACES + gamma itself
  renderer.outputEncoding = THREE.LinearEncoding;
  renderer.toneMapping = THREE.NoToneMapping;
}else{
  renderer.outputEncoding = THREE.sRGBEncoding;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.05;
}

var scene = new THREE.Scene();
var FOG_COLOR = new THREE.Color(0.045, 0.004, 0.006);   // near-black oxblood murk
var FOG_DENSITY = 0.018;
scene.fog = new THREE.FogExp2(FOG_COLOR, FOG_DENSITY);
var camera = new THREE.PerspectiveCamera(68, window.innerWidth/window.innerHeight, 0.1, 260);

// ---------- noise helpers (texture + geometry generation) ----------
function lattice2(w){
  var g = new Float32Array(w*w);
  for(var i=0;i<w*w;i++) g[i] = Math.random();
  // px/py: wrap periods in lattice cells, so sampling u*px tiles seamlessly
  return function(x,y,px,py){
    var xi = Math.floor(x), yi = Math.floor(y);
    var xf = x-xi, yf = y-yi;
    var sx = xf*xf*(3-2*xf), sy = yf*yf*(3-2*yf);
    var x0 = ((xi%px)+px)%px, x1 = (x0+1)%px, y0 = ((yi%py)+py)%py, y1 = (y0+1)%py;
    var a = g[y0*w+x0], b = g[y0*w+x1], c = g[y1*w+x0], d = g[y1*w+x1];
    return a + (b-a)*sx + (c-a)*sy + (a-b-c+d)*sx*sy;
  };
}
function hash3(x,y,z){
  var n = Math.sin(x*127.1 + y*311.7 + z*74.7) * 43758.5453;
  return n - Math.floor(n);
}
function noise3(x,y,z){
  var xi=Math.floor(x), yi=Math.floor(y), zi=Math.floor(z);
  var xf=x-xi, yf=y-yi, zf=z-zi;
  var sx=xf*xf*(3-2*xf), sy=yf*yf*(3-2*yf), sz=zf*zf*(3-2*zf);
  var c000=hash3(xi,yi,zi),   c100=hash3(xi+1,yi,zi),   c010=hash3(xi,yi+1,zi),   c110=hash3(xi+1,yi+1,zi);
  var c001=hash3(xi,yi,zi+1), c101=hash3(xi+1,yi,zi+1), c011=hash3(xi,yi+1,zi+1), c111=hash3(xi+1,yi+1,zi+1);
  var x00=c000+(c100-c000)*sx, x10=c010+(c110-c010)*sx;
  var x01=c001+(c101-c001)*sx, x11=c011+(c111-c011)*sx;
  var y0=x00+(x10-x00)*sy, y1=x01+(x11-x01)*sy;
  return y0+(y1-y0)*sz;
}

// ---------- the vessel: a closed, endless loop ----------
var ctrl = [];
var LOOP_N = 18;
for(var li=0; li<LOOP_N; li++){
  var a = li/LOOP_N * Math.PI*2;
  var R = 205 + Math.sin(a*3.0)*34 + Math.cos(a*5.0)*14;
  ctrl.push(new THREE.Vector3(
    Math.cos(a)*R,
    Math.sin(a*2.0)*28 + Math.cos(a*3.0)*12,
    Math.sin(a)*R
  ));
}
ctrl.reverse();   // travel the vessel in the opposite direction
var curve = new THREE.CatmullRomCurve3(ctrl, true, 'catmullrom', 0.5);
var curveLen = curve.getLength();
var FRAME_SEGS = 1200;
var frames = curve.computeFrenetFrames(FRAME_SEGS, true);

// flatten curve samples + Frenet frames into typed arrays: per-frame lookups
// become three float lerps instead of spline evals + Vector3 allocations
var posT = new Float32Array(FRAME_SEGS*3), norT = new Float32Array(FRAME_SEGS*3),
    binT = new Float32Array(FRAME_SEGS*3), tanT = new Float32Array(FRAME_SEGS*3);
(function(){
  var v = new THREE.Vector3();
  for(var i=0;i<FRAME_SEGS;i++){
    curve.getPointAt(i/FRAME_SEGS, v);
    posT[i*3]=v.x; posT[i*3+1]=v.y; posT[i*3+2]=v.z;
    var n=frames.normals[i], b=frames.binormals[i];
    norT[i*3]=n.x; norT[i*3+1]=n.y; norT[i*3+2]=n.z;
    binT[i*3]=b.x; binT[i*3+1]=b.y; binT[i*3+2]=b.z;
    var tg=frames.tangents[i];
    tanT[i*3]=tg.x; tanT[i*3+1]=tg.y; tanT[i*3+2]=tg.z;
  }
})();

function wrap01(u){ u = u % 1; return u < 0 ? u+1 : u; }
function pointAt(u, out){
  var f = wrap01(u)*FRAME_SEGS, i0 = Math.floor(f), a = f - i0;
  var j0 = (i0%FRAME_SEGS)*3, j1 = ((i0+1)%FRAME_SEGS)*3;
  out.set(posT[j0]+(posT[j1]-posT[j0])*a,
          posT[j0+1]+(posT[j1+1]-posT[j0+1])*a,
          posT[j0+2]+(posT[j1+2]-posT[j0+2])*a);
  return out;
}
function frameAt(u, N, B, T){
  var f = wrap01(u)*FRAME_SEGS, i0 = Math.floor(f), a = f - i0;
  var j0 = (i0%FRAME_SEGS)*3, j1 = ((i0+1)%FRAME_SEGS)*3;
  N.set(norT[j0]+(norT[j1]-norT[j0])*a, norT[j0+1]+(norT[j1+1]-norT[j0+1])*a,
        norT[j0+2]+(norT[j1+2]-norT[j0+2])*a).normalize();
  B.set(binT[j0]+(binT[j1]-binT[j0])*a, binT[j0+1]+(binT[j1+1]-binT[j0+1])*a,
        binT[j0+2]+(binT[j1+2]-binT[j0+2])*a).normalize();
  if(T){
    var t0=frames.tangents[i0%FRAME_SEGS], t1=frames.tangents[(i0+1)%FRAME_SEGS];
    T.copy(t0).lerp(t1, a).normalize();
  }
}

var VESSEL_R = 9;

// ---------- wall textures: endothelium, generated procedurally ----------
function makeWallMaps(size){
  var n1 = lattice2(64), n2 = lattice2(64), n3 = lattice2(64);
  var height = new Float32Array(size*size);
  // endothelial pavement: toroidal Voronoi border field — a connected network of
  // cell boundaries (F2-F1 metric), slightly stretched along the flow direction
  var VG = 13, VP = [];
  for(var vy=0; vy<VG; vy++){
    VP.push([]);
    for(var vx=0; vx<VG; vx++){
      VP[vy].push([(vx+0.15+Math.random()*0.7)/VG, (vy+0.15+Math.random()*0.7)/VG]);
    }
  }
  function voroBorder(u2, v2){
    var cu = Math.floor(u2*VG), cv = Math.floor(v2*VG);
    var d1 = 9, d2 = 9;
    for(var oy=-1; oy<=1; oy++){
      for(var ox=-1; ox<=1; ox++){
        var p2 = VP[((cv+oy)%VG+VG)%VG][((cu+ox)%VG+VG)%VG];
        var du = Math.abs(u2-p2[0]); du = Math.min(du, 1-du) * 0.72;  // stretch along flow
        var dv = Math.abs(v2-p2[1]); dv = Math.min(dv, 1-dv);
        var d = Math.sqrt(du*du+dv*dv);
        if(d<d1){ d2=d1; d1=d; } else if(d<d2){ d2=d; }
      }
    }
    var e2 = d2-d1;                          // 0 exactly on a border
    return e2 > 0.016 ? 0 : 1 - e2/0.016;
  }
  var img = document.createElement('canvas'); img.width = img.height = size;
  var ig = img.getContext('2d');
  var idata = ig.createImageData(size,size);
  var rough = document.createElement('canvas'); rough.width = rough.height = size;
  var rg = rough.getContext('2d');
  var rdata = rg.createImageData(size,size);
  for(var y=0;y<size;y++){
    for(var x=0;x<size;x++){
      var u = x/size, v = y/size;
      // near-isotropic mottling with one broad octave for macro variation (all octaves tile)
      // fibres run around the vessel (long in v, short in u) with a helical tilt;
      // every octave keeps integer periods so the map still tiles seamlessly
      var macro = n1(u*5+2, v*3+1, 5,3);
      var fu = u*44 + v*11 + macro*3.0, fv = v*14;
      var fib = n1(fu, fv, 11,14)*0.55 + n2(fu*2+3, fv*2+1, 22,28)*0.30 + n3(u*120, v*40, 120,40)*0.15;
      var h = fib*0.72 + macro*0.28;
      h = h*h*(3-2*h);
      var i4 = (y*size+x)*4;
      // pavement shows in patches; elsewhere the wall is smooth mucosa
      var msk = Math.min(1, Math.max(0, (n2(u*3+5, v*3+9, 3,3)-0.35)/0.30));
      var border = 0.0;   // reference tissue is fibrous, not cobblestone
      h = Math.max(0, h - border*0.10);        // cell borders sit in shallow grooves
      height[y*size+x] = h;
      // albedo: deep crimson tissue with baked crevice AO, faint fat flecks
      var t = h;
      var ao = 0.40 + 0.60*t;
      var r = (40 + t*100)*ao, g = (5 + t*22)*ao, b = (6 + t*15)*ao;
      var fleck = n3(u*44, v*44, 44,44);
      if(fleck > 0.87){ var f=(fleck-0.87)/0.13; r += f*40; g += f*30; b += f*6; }
      var bshade = 1 - border*0.13;
      r *= bshade; g *= bshade; b *= bshade;
      idata.data[i4]=r; idata.data[i4+1]=g; idata.data[i4+2]=b; idata.data[i4+3]=255;
      // roughness: wet tissue, glossier in the crevices where plasma films pool
      var ro = 100 + t*90;
      rdata.data[i4]=ro; rdata.data[i4+1]=ro; rdata.data[i4+2]=ro; rdata.data[i4+3]=255;
    }
  }
  ig.putImageData(idata,0,0);
  rg.putImageData(rdata,0,0);
  // normal map from the height field
  var nrm = document.createElement('canvas'); nrm.width = nrm.height = size;
  var ng = nrm.getContext('2d');
  var ndata = ng.createImageData(size,size);
  var S = 4.2;
  for(var y2=0;y2<size;y2++){
    for(var x2=0;x2<size;x2++){
      var xm=(x2-1+size)%size, xp=(x2+1)%size, ym=(y2-1+size)%size, yp=(y2+1)%size;
      var dx=(height[y2*size+xp]-height[y2*size+xm])*S;
      var dy=(height[yp*size+x2]-height[ym*size+x2])*S;
      var inv=1/Math.sqrt(dx*dx+dy*dy+1);
      var j4=(y2*size+x2)*4;
      ndata.data[j4]  =(-dx*inv*0.5+0.5)*255;
      ndata.data[j4+1]=(-dy*inv*0.5+0.5)*255;
      ndata.data[j4+2]=( inv*0.5+0.5)*255;
      ndata.data[j4+3]=255;
    }
  }
  ng.putImageData(ndata,0,0);
  var mapT = new THREE.CanvasTexture(img);
  mapT.wrapS = mapT.wrapT = THREE.RepeatWrapping; mapT.encoding = THREE.sRGBEncoding;
  var nrmT = new THREE.CanvasTexture(nrm);
  nrmT.wrapS = nrmT.wrapT = THREE.RepeatWrapping;
  var rouT = new THREE.CanvasTexture(rough);
  rouT.wrapS = rouT.wrapT = THREE.RepeatWrapping;
  return {map:mapT, normal:nrmT, rough:rouT};
}
var wallMaps = makeWallMaps(512);    // fog+grain hide anything finer; keeps startup fast
// square texel aspect in world space: loop ~1290 units long, circumference ~57
var maxAniso = Math.min(8, renderer.capabilities.getMaxAnisotropy());
wallMaps.map.anisotropy = maxAniso;
wallMaps.normal.anisotropy = maxAniso;
wallMaps.rough.anisotropy = maxAniso;
wallMaps.map.repeat.set(46, 2);      // u runs along the tube, v around it
wallMaps.normal.repeat.set(46, 2);
wallMaps.rough.repeat.set(46, 2);

var TUBE_SEGS = isSmall?700:1200, TUBE_RADIAL = isSmall?20:28;
var tubeGeo = new THREE.TubeGeometry(curve, TUBE_SEGS, VESSEL_R, TUBE_RADIAL, true);
// organic, lumpy lumen: displace vertices with world-space 3D noise
(function(){
  var pos = tubeGeo.attributes.position, nor = tubeGeo.attributes.normal;
  var p = new THREE.Vector3(), n = new THREE.Vector3();
  for(var i=0;i<pos.count;i++){
    p.set(pos.getX(i),pos.getY(i),pos.getZ(i));
    n.set(nor.getX(i),nor.getY(i),nor.getZ(i));
    var d = (noise3(p.x*0.055,p.y*0.055,p.z*0.055)-0.42)*3.2
          + (noise3(p.x*0.22, p.y*0.22, p.z*0.22)-0.5)*1.1;
    d = Math.max(d, -1.0);          // keep the lumen clear of the particle orbits
    p.addScaledVector(n, d);
    pos.setXYZ(i,p.x,p.y,p.z);
  }
  tubeGeo.computeVertexNormals();
  // weld normals across the duplicated UV seams (lengthwise row + closure ring),
  // otherwise computeVertexNormals leaves a visible straight shading line
  var nn = tubeGeo.attributes.normal;
  var ring = TUBE_RADIAL+1;
  var va = new THREE.Vector3(), vb = new THREE.Vector3();
  for(var r2=0;r2<=TUBE_SEGS;r2++){
    var a2 = r2*ring, b2 = r2*ring + TUBE_RADIAL;
    va.set(nn.getX(a2),nn.getY(a2),nn.getZ(a2));
    vb.set(nn.getX(b2),nn.getY(b2),nn.getZ(b2));
    va.add(vb).normalize();
    nn.setXYZ(a2,va.x,va.y,va.z); nn.setXYZ(b2,va.x,va.y,va.z);
  }
  for(var c2=0;c2<ring;c2++){
    var a3 = c2, b3 = TUBE_SEGS*ring + c2;
    va.set(nn.getX(a3),nn.getY(a3),nn.getZ(a3));
    vb.set(nn.getX(b3),nn.getY(b3),nn.getZ(b3));
    va.add(vb).normalize();
    nn.setXYZ(a3,va.x,va.y,va.z); nn.setXYZ(b3,va.x,va.y,va.z);
  }
})();
var wallMat = new THREE.MeshStandardMaterial({
  map:wallMaps.map, normalMap:wallMaps.normal, roughnessMap:wallMaps.rough,
  normalScale:new THREE.Vector2(2.2,2.2),
  color:0xffffff, roughness:1.0, metalness:0.0,
  emissive:0x090103, side:THREE.BackSide
});
// living wall: a heartbeat contraction wave travels along the vessel and
// visibly squeezes the lumen as it sweeps past (uv.x runs 0..1 around the loop)
wallMat.onBeforeCompile = function(shader){
  shader.uniforms.uWavePos = {value:-9999};
  shader.uniforms.uWaveAmp = {value:0};
  shader.uniforms.uLoopLen = {value:curveLen};
  shader.vertexShader = shader.vertexShader
    .replace('#include <common>',
      '#include <common>\nuniform float uWavePos;\nuniform float uWaveAmp;\nuniform float uLoopLen;')
    .replace('#include <begin_vertex>',
      ['#include <begin_vertex>',
       'float aAlong = uv.x * uLoopLen;',
       'float dWave = mod(aAlong - uWavePos + uLoopLen*1.5, uLoopLen) - uLoopLen*0.5;',
       'float squeeze = exp(-dWave*dWave/22.0) * uWaveAmp;',
       'vWaveGlow = exp(-dWave*dWave/110.0) * uWaveAmp;',
       'transformed -= normal * squeeze * 1.15;'].join('\n'));
  shader.vertexShader = shader.vertexShader.replace('uniform float uLoopLen;',
      'uniform float uLoopLen;\nvarying float vWaveGlow;');
  shader.fragmentShader = shader.fragmentShader
    .replace('#include <common>', '#include <common>\nvarying float vWaveGlow;')
    .replace('#include <emissivemap_fragment>',
      '#include <emissivemap_fragment>\ntotalEmissiveRadiance += vec3(1.0,0.24,0.08) * vWaveGlow * 0.75;');
  wallMat.userData.shader = shader;
};
scene.add(new THREE.Mesh(tubeGeo, wallMat));

// ---------- lights ----------
scene.add(new THREE.HemisphereLight(0x3a070d, 0x0a0102, 0.14));
var keyLight = new THREE.PointLight(0xffd9b0, 1.6, 120, 2); scene.add(keyLight);
var backLight = new THREE.PointLight(0xff4a30, 8.0, 80, 2); scene.add(backLight);

// glowing murk down the tunnel: the far distance reads as scattering plasma,
// never a black hole, and it feeds bloom a plausible distant source
function murkTexture(){
  var c = document.createElement('canvas'); c.width=c.height=256;
  var g = c.getContext('2d');
  var grad = g.createRadialGradient(128,128,0,128,128,128);
  grad.addColorStop(0,'rgba(255,150,130,0.85)');
  grad.addColorStop(0.35,'rgba(210,50,36,0.45)');
  grad.addColorStop(1,'rgba(120,16,12,0)');
  g.fillStyle=grad; g.fillRect(0,0,256,256);
  return new THREE.CanvasTexture(c);
}
var murk = new THREE.Sprite(new THREE.SpriteMaterial({map:murkTexture(),
  blending:THREE.AdditiveBlending, depthWrite:false, transparent:true, opacity:0.85}));
murk.scale.set(24,24,1);
scene.add(murk);

// ---------- shared cell shader: wrap diffuse + wet spec + backlit translucency ----------
var cellVert = [
  'uniform float uTime;',
  'varying vec3 vN;',
  'varying vec3 vWorld;',
  'varying vec3 vTint;',
  'varying vec3 vObj;',
  'varying float vDimple;',
  'void main(){',
  '  vec3 p = position;',
  '  vec3 n = normal;',
  '  vObj = position;',
  '  vDimple = 1.0 - clamp(length(position.xz), 0.0, 1.0);',
  '  #ifdef USE_INSTANCING',
  '    float seed = instanceColor.r*61.0 + instanceColor.g*17.0;',
  '    vTint = instanceColor;',
  '    p += n * 0.07 * sin(uTime*2.4 + seed + p.x*3.5 + p.z*2.5);',   // membrane flex
  '    vec4 wp = modelMatrix * instanceMatrix * vec4(p,1.0);',
  '    vN = normalize(mat3(modelMatrix) * mat3(instanceMatrix) * n);',
  '  #else',
  '    vTint = vec3(1.0);',
  '    p += n * 0.04 * sin(uTime*1.7 + p.y*3.0);',
  '    vec4 wp = modelMatrix * vec4(p,1.0);',
  '    vN = normalize(mat3(modelMatrix) * n);',
  '  #endif',
  '  vWorld = wp.xyz;',
  '  gl_Position = projectionMatrix * viewMatrix * wp;',
  '}'
].join('\n');

var cellFrag = [
  'uniform sampler2D uNoise;',
  'uniform vec3 uCamPos;',
  'uniform vec3 uKeyPos;',
  'uniform vec3 uBackPos;',
  'uniform vec3 uAlbedo;',
  'uniform vec3 uGlow;',      // transmitted color
  'uniform vec3 uRim;',
  'uniform float uSpec;',
  'uniform float uPulse;',
  'uniform float uGrade;',    // 1 => tonemap in-shader (no post chain)
  'uniform float uFogDensity;',
  'uniform vec3 uFogColor;',
  'varying vec3 vN;',
  'varying vec3 vWorld;',
  'varying vec3 vTint;',
  'varying vec3 vObj;',
  'varying float vDimple;',
  'vec3 aces(vec3 x){',
  '  return clamp((x*(2.51*x+0.03))/(x*(2.43*x+0.59)+0.14),0.0,1.0);',
  '}',
  'void main(){',
  '  vec3 N = normalize(vN);',
  '  vec3 V = normalize(uCamPos - vWorld);',
  '  if(dot(N,V) < 0.0) N = -N;',
  '  float fd = -(viewMatrix * vec4(vWorld, 1.0)).z;',
  // membrane micro-relief: perturb the normal so highlights break up organically;
  // amplitude fades with distance so it never shimmers far away
  '  vec3 Tt = normalize(cross(N, vec3(0.577,0.577,0.577)));',
  '  vec3 Bt = cross(N, Tt);',
  '  vec2 mm = texture2D(uNoise, (vObj.xy + vObj.z*0.37)*0.35 + vec2(vTint.r*7.31, vTint.g*5.17)).rg;',
  '  float na = clamp(1.4 - fd*0.12, 0.0, 1.0) * 0.5;',
  '  N = normalize(N + Tt*(mm.x-0.5)*na + Bt*(mm.y-0.5)*na);',
  '  vec3 albedo = uAlbedo * vTint;',
  '  albedo *= 0.88 + 0.28*mm.x;',      // surface pigment variation kills the sticker look
  // haemoglobin absorption: the thick rim runs deeper red than the thin centre
  '  float thickness = 1.0 - 0.68*vDimple;',
  '  albedo *= mix(vec3(1.30,1.18,1.10), vec3(0.80,0.72,0.70), thickness);',
  // key light: warm, near the camera
  '  vec3 Ld = uKeyPos - vWorld;',
  '  float kd = length(Ld); Ld /= kd;',
  '  float katt = 1.0/(1.0 + 0.006*kd*kd);',
  '  float wrap = clamp((dot(N,Ld)+0.45)/1.45, 0.0, 1.0);',
  '  vec3 col = albedo * wrap * katt * (1.45 + 0.30*uPulse);',
  '  col *= 1.0 - vDimple*0.55;',   // biconcave centre reads darker
  // wet membrane specular
  // moist membrane: a broad dim sheen plus a soft-clamped highlight, never a candy dot
  '  vec3 H = normalize(Ld + V);',
  '  col += vec3(1.0,0.90,0.82) * min(pow(max(dot(N,H),0.0), 48.0) * uSpec, 0.35) * katt;',
  '  col += vec3(1.0,0.72,0.60) * pow(1.0 - max(dot(N,V),0.0), 2.5) * 0.28 * katt;',
  // translucency: the deep red glow ahead shines THROUGH thin cells
  '  vec3 Bd = uBackPos - vWorld;',
  '  float bd = length(Bd); Bd /= bd;',
  '  float batt = 1.0/(1.0 + 0.004*bd*bd);',
  '  float trans = pow(max(dot(Bd, -V), 0.0), 6.0);',
  '  float thin = 0.35 + 0.65*max(1.0 - abs(dot(N,V))*0.5, vDimple*1.15);',
  '  col += uGlow * trans * thin * batt * (0.55 + 0.35*uPulse);',
  // soft rim of scattered red
  '  float rim = pow(1.0 - max(dot(N,V),0.0), 2.6);',
  '  col += uRim * rim;',
  // ambient murk bounce
  '  col += albedo * 0.10;',
  // plasma swallows green then blue then contrast before the fog takes over —
  // distant cells melt into the murk instead of floating on top of it
  '  col.g *= exp(-fd*0.045);',
  '  col.b *= exp(-fd*0.060);',
  '  col = mix(col, uFogColor*1.8, clamp(fd*0.010, 0.0, 0.30));',
  // fog: same formula and view-space depth metric as THREE.FogExp2
  '  float f = clamp(1.0 - exp(-uFogDensity*uFogDensity*fd*fd), 0.0, 1.0);',
  // built-ins fog AFTER tonemapping, so the degraded path must grade first too
  '  if(uGrade > 0.5){ col = aces(col); col = pow(col, vec3(1.0/2.2)); }',
  '  col = mix(col, uFogColor, f);',
  '  gl_FragColor = vec4(max(col, vec3(0.0)), 1.0);',
  '}'
].join('\n');

// membrane micro-relief baked once to a tiling texture: one fetch per fragment
// instead of sixteen sin() hashes
var cellNoiseTex = (function(){
  var s=128, c=document.createElement('canvas'); c.width=c.height=s;
  var g=c.getContext('2d'), id=g.createImageData(s,s);
  var nA=lattice2(64), nB=lattice2(64);
  for(var y=0;y<s;y++){
    for(var x=0;x<s;x++){
      var u=x/s, v=y/s, i4=(y*s+x)*4;
      id.data[i4]   = (nA(u*6,v*6,6,6)*0.7 + nA(u*13,v*13,13,13)*0.3)*255;
      id.data[i4+1] = (nB(u*6+3,v*6+1,6,6)*0.7 + nB(u*13+5,v*13+2,13,13)*0.3)*255;
      id.data[i4+2] = 128; id.data[i4+3] = 255;
    }
  }
  g.putImageData(id,0,0);
  var tex = new THREE.CanvasTexture(c);
  tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
  return tex;
})();

function cellMaterial(albedo, glow, spec, rim){

      uTime:{value:0}, uCamPos:{value:new THREE.Vector3()},

      uRim:{value:new THREE.Color(rim)}, uSpec:{value:spec},

// ---------- red blood cells ----------
// computeVertexNormals leaves one-sided normals on a sphere's duplicated
// longitude-seam column (and pole fans) — weld them so no seam line shades in
function weldSphereNormals(geo, widthSegs, heightSegs, forcePoles){
  var nn = geo.attributes.normal, ring = widthSegs+1;
  var va = new THREE.Vector3(), vb = new THREE.Vector3();
  for(var row=0; row<=heightSegs; row++){
    var a = row*ring, b = row*ring + widthSegs;
    va.set(nn.getX(a),nn.getY(a),nn.getZ(a));
    vb.set(nn.getX(b),nn.getY(b),nn.getZ(b));
    va.add(vb).normalize();
    nn.setXYZ(a,va.x,va.y,va.z); nn.setXYZ(b,va.x,va.y,va.z);
  }
  if(forcePoles){
    for(var c3=0; c3<ring; c3++){
      nn.setXYZ(c3, 0, 1, 0);
      nn.setXYZ(heightSegs*ring + c3, 0, -1, 0);
    }
  }
}

function biconcaveGeo(){
  // Evans-Fung measured discocyte profile: thick torus rim, thin dimpled centre
  var geo = new THREE.SphereGeometry(1, 36, 24);
  var pos = geo.attributes.position;
  for(var i=0;i<pos.count;i++){
    var x=pos.getX(i), y=pos.getY(i), z=pos.getZ(i);
    var r=Math.min(1, Math.sqrt(x*x+z*z)), r2=r*r;
    var prof=0.5*Math.sqrt(Math.max(0,1-r2))*(0.207+2.003*r2-1.123*r2*r2);
    pos.setY(i, (y>=0?1:-1)*Math.max(prof, 0.02*(1-r2))*0.86);
  }
  geo.computeVertexNormals();
  weldSphereNormals(geo, 36, 24, true);
  return geo;
}

cells.instanceMatrix.setUsage(THREE.DynamicDrawUsage);

var AHEAD = 75, BEHIND = 14, WINDOW = AHEAD + BEHIND;

  cellData.push({
    s: Math.random()*WINDOW - BEHIND,
    r: rr, th: Math.random()*Math.PI*2,
    spin:(Math.random()-0.5)*1.6,
    axis:new THREE.Vector3(Math.random()-0.5,Math.random()-0.5,Math.random()-0.5).normalize(),
    sc: 1.0+Math.pow(Math.random(),1.5)*0.6,
    align: Math.min(0.85, (0.45+Math.random()*0.30)*(0.75+0.5*rr/VESSEL_R)),
    wob: Math.random()*6.283,
    // the camera OVERTAKES the flow: cells stream past, which is what sells speed
    flow: 0.60 - Math.pow(rr/VESSEL_R,2)*0.25
  });
  // haemoglobin gives every RBC the same pigment: hue jitter stays within ±3°,
  // and all visible color spread comes from thickness and lighting instead
  tint.setHSL(0.986+Math.random()*0.016, 0.78+Math.random()*0.10, 0.36+Math.random()*0.10);

function leukocyteGeo(){
  var g = new THREE.SphereGeometry(1.1, 40, 28);    // indexed => smooth shared normals
  var p = g.attributes.position, v = new THREE.Vector3();
  for(var i=0;i<p.count;i++){
    v.set(p.getX(i),p.getY(i),p.getZ(i));

              + (noise3(v.x*9.0, v.y*9.0+4.0, v.z*9.0)-0.5)*0.09;   // microvilli fuzz
    v.multiplyScalar(n); p.setXYZ(i,v.x,v.y,v.z);
  }
  g.computeVertexNormals();
  weldSphereNormals(g, 40, 28, false);
  return g;
}

// ---------- post chain: bloom + grade (grain, CA, vignette, ACES) ----------
var composer = null, gradePass = null, bloom = null, bokehPass = null;
if(postOK){
  composer = new THREE.EffectComposer(renderer);
  composer.addPass(new THREE.RenderPass(scene, camera));
  // true depth of field: near cells and far murk soften around a focus plane
  if(THREE.BokehPass && THREE.BokehShader && !isSmall){
    try{
      bokehPass = new THREE.BokehPass(scene, camera, {
        focus: 9.0, aperture: 0.0005, maxblur: 0.014,
        width: window.innerWidth, height: window.innerHeight
      });
      // r134 BokehPass ships needsSwap=false: without this the composited DoF
      // is written to the write buffer and silently discarded by the next pass
      bokehPass.needsSwap = true;
      // keep the camera-attached sprites and the murk glow out of the depth
      // prepass — as solid quads they would stamp wrong focus patches
      var _bpRender = bokehPass.render.bind(bokehPass);
      bokehPass.render = function(){
        murk.visible = false;
        for(var hb=0; hb<bokehs.length; hb++) bokehs[hb].spr.visible = false;
        _bpRender.apply(null, arguments);
        murk.visible = true;
        for(var hb2=0; hb2<bokehs.length; hb2++) bokehs[hb2].spr.visible = true;
      };
      composer.addPass(bokehPass);
    }catch(e){ bokehPass = null; }
  }
  // fixed low base resolution: the 5-mip blur destroys finer detail anyway, and
  // r134's composer.setSize would otherwise silently rebuild it at device pixels
  bloom = new THREE.UnrealBloomPass(new THREE.Vector2(960, 540), 0.75, 0.6, 0.7);
  composer.addPass(bloom);
  var GradeShader = {
    uniforms:{
      tDiffuse:{value:null}, uTime:{value:0}, uPulse:{value:0},
      uRes:{value:new THREE.Vector2(1,1)},
      uLight:{value:new THREE.Vector2(0.5,0.5)}, uRays:{value:0}, uZoom:{value:0}
    },
    vertexShader:[
      'varying vec2 vUv;',
      'void main(){ vUv = uv; gl_Position = projectionMatrix*modelViewMatrix*vec4(position,1.0); }'
    ].join('\n'),
    fragmentShader:[
      'uniform sampler2D tDiffuse;',
      'uniform float uTime;',
      'uniform float uPulse;',
      'uniform vec2 uRes;',
      'uniform vec2 uLight;',
      'uniform float uRays;',
      'uniform float uZoom;',
      'varying vec2 vUv;',
      'vec3 aces(vec3 x){',
      '  return clamp((x*(2.51*x+0.03))/(x*(2.43*x+0.59)+0.14),0.0,1.0);',
      '}',
      'float hash(vec2 p){ return fract(sin(dot(p, vec2(127.1,311.7)))*43758.5453); }',
      'void main(){',
      '  vec2 c = vUv - 0.5;',
      '  float r2 = dot(c,c);',
      '  float ca = (0.0024 + uPulse*0.0014) * r2 * 2.0;',
      // swimming through fluid: a faint refractive wobble on the lens
      '  vec2 wob = vec2(sin(vUv.y*6.0+uTime*0.8), cos(vUv.x*5.0+uTime*0.6))*0.0016*(1.0+uPulse*0.8);',
      '  vec2 uvb = vUv + wob;',
      '  vec3 col;',
      '  col.r = texture2D(tDiffuse, uvb + c*ca).r;',
      '  col.g = texture2D(tDiffuse, uvb).g;',
      '  col.b = texture2D(tDiffuse, uvb - c*ca).b;',
      // velocity streak: radial smear that grows toward the frame edges,
      // leaving the center crisp — pure speed, no loss of focus
      '  float zb = uZoom * (0.25 + r2*2.6);',
      '  if(zb > 0.0004){',
      '    vec3 z1 = texture2D(tDiffuse, uvb - c*zb*0.8).rgb;',
      '    vec3 z2 = texture2D(tDiffuse, uvb - c*zb*1.6).rgb;',
      '    vec3 z3 = texture2D(tDiffuse, uvb - c*zb*2.4).rgb;',
      '    col = col*0.40 + z1*0.26 + z2*0.20 + z3*0.14;',
      '  }',
      // crepuscular rays: march toward the backlight, scattered red light surges with the pulse
      '  if(uRays > 0.001){',
      '    vec2 stepv = (uLight - vUv) / 11.0;',
      '    float illum = 1.0; float rays = 0.0; vec2 sp = vUv;',
      '    for(int i=0;i<10;i++){',
      '      sp += stepv; illum *= 0.84;',
      '      rays += dot(texture2D(tDiffuse, sp).rgb, vec3(0.55,0.30,0.15)) * illum;',
      '    }',
      '    col += vec3(1.0,0.30,0.14) * rays * uRays * 0.028;',
      '  }',
      '  col *= 1.0 + uPulse*0.10;',
      '  col *= vec3(1.0, 0.86, 0.88);',    // deep crimson, not orange
      '  col = mix(vec3(dot(col, vec3(0.3,0.59,0.11))), col, 1.15);',
      '  col = aces(col);',
      '  col = pow(col, vec3(1.0/2.2));',
      '  float vig = smoothstep(0.9, 0.2, r2*1.7);',
      '  col *= mix(0.58, 1.0, vig);',
      '  col += (hash(vUv*uRes + vec2(mod(uTime,7.0)*13.0)) - 0.5) * 0.026;',
      '  gl_FragColor = vec4(col, 1.0);',
      '}'
    ].join('\n')
  };
  gradePass = new THREE.ShaderPass(GradeShader);
  gradePass.renderToScreen = true;
  composer.addPass(gradePass);
  gradePass.uniforms.uRes.value.set(window.innerWidth, window.innerHeight);
}

// ---------- audio: heartbeat + flow, generated, starts on first gesture ----------
var AC=null, master=null, whooshGain=null, whooshFilter=null, whooshPan=null, muted=false;
function audioInit(){
  if(AC) return;
  try{ AC = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){ return; }
  master = AC.createGain(); master.gain.value = muted?0:0.8; master.connect(AC.destination);
  var len = AC.sampleRate*2, buf = AC.createBuffer(1,len,AC.sampleRate);
  var d = buf.getChannelData(0), last=0;
  for(var i=0;i<len;i++){ var w=Math.random()*2-1; last=(last+0.02*w)/1.02; d[i]=last*3.2; }
  var src = AC.createBufferSource(); src.buffer=buf; src.loop=true;
  whooshFilter = AC.createBiquadFilter(); whooshFilter.type='lowpass'; whooshFilter.frequency.value=320;
  whooshGain = AC.createGain(); whooshGain.gain.value=0.14;
  src.connect(whooshFilter); whooshFilter.connect(whooshGain);
  if(AC.createStereoPanner){
    whooshPan = AC.createStereoPanner();
    whooshGain.connect(whooshPan); whooshPan.connect(master);
  }else{
    whooshGain.connect(master);
  }
  src.start();
  // body drone: two barely-detuned low sines beating slowly against each other
  [55, 55.7].forEach(function(fq){
    var o = AC.createOscillator(); o.type='sine'; o.frequency.value=fq;
    var g = AC.createGain(); g.gain.value=0.028;
    o.connect(g); g.connect(master); o.start();
  });
}
function thump(){
  if(!AC || AC.state!=='running') return;
  var t = AC.currentTime;
  var vigor = 0.85 + Math.random()*0.3;          // no two beats identical
  // soft valve click riding on the lub
  var nb = AC.createBufferSource();
  nb.buffer = (function(){
    var n = AC.createBuffer(1, AC.sampleRate*0.03, AC.sampleRate);
    var dd = n.getChannelData(0);
    for(var i2=0;i2<dd.length;i2++) dd[i2] = (Math.random()*2-1)*(1-i2/dd.length);
    return n;
  })();
  var hp = AC.createBiquadFilter(); hp.type='highpass'; hp.frequency.value=900;
  var ng = AC.createGain(); ng.gain.value = 0.05*vigor;
  nb.connect(hp); hp.connect(ng); ng.connect(master); nb.start(t+0.01);
  // the pulse wave rushing past: a short rising sweep right after the lub
  var sw = AC.createBufferSource();
  sw.buffer = (function(){
    var n = AC.createBuffer(1, AC.sampleRate*0.45, AC.sampleRate);
    var dd = n.getChannelData(0);
    for(var i3=0;i3<dd.length;i3++) dd[i3] = Math.random()*2-1;
    return n;
  })();
  var bp = AC.createBiquadFilter(); bp.type='bandpass'; bp.Q.value=1.2;
  bp.frequency.setValueAtTime(350, t+0.08);
  bp.frequency.exponentialRampToValueAtTime(1700, t+0.42);
  var sg = AC.createGain();
  sg.gain.setValueAtTime(0.0001, t+0.08);
  sg.gain.exponentialRampToValueAtTime(0.09*vigor, t+0.17);
  sg.gain.exponentialRampToValueAtTime(0.0001, t+0.50);
  sw.connect(bp); bp.connect(sg); sg.connect(master);
  sw.start(t+0.08); sw.stop(t+0.52);
  [[0,0.5*vigor,52],[0.16,0.3*vigor,40]].forEach(function(hit){
    var o=AC.createOscillator(), g=AC.createGain();
    o.type='sine';
    o.frequency.setValueAtTime(hit[2], t+hit[0]);
    o.frequency.exponentialRampToValueAtTime(28, t+hit[0]+0.22);
    g.gain.setValueAtTime(0.0001, t+hit[0]);
    g.gain.exponentialRampToValueAtTime(hit[1], t+hit[0]+0.015);
    g.gain.exponentialRampToValueAtTime(0.0001, t+hit[0]+0.35);
    o.connect(g); g.connect(master);
    o.start(t+hit[0]); o.stop(t+hit[0]+0.4);
  });
}
function unlockAudio(){
  audioInit();
  if(AC && AC.state==='suspended') AC.resume();
}
window.addEventListener('pointerdown', unlockAudio);
window.addEventListener('keydown', function(e){
  unlockAudio();
  if(e.key==='f'||e.key==='F'){
    var doc=document;
    if(!doc.fullscreenElement){ doc.documentElement.requestFullscreen && doc.documentElement.requestFullscreen(); }
    else{ doc.exitFullscreen && doc.exitFullscreen(); }
  }else if(e.key==='m'||e.key==='M'){
    muted=!muted; if(master) master.gain.value = muted?0:0.8;
  }
});

// hide the cursor over the endless scene
var cursorTimer=null;
function wakeCursor(){
  document.body.classList.remove('hidecursor');
  clearTimeout(cursorTimer);
  cursorTimer=setTimeout(function(){ document.body.classList.add('hidecursor'); },2000);
}
wakeCursor();

// look around: mouse steers the gaze gently; phones use device tilt
var lookTX=0, lookTY=0, lookX=0, lookY=0;
window.addEventListener('mousemove', function(e){
  wakeCursor();
  lookTX = (e.clientX/window.innerWidth  - 0.5)*2;
  lookTY = (e.clientY/window.innerHeight - 0.5)*2;
});
window.addEventListener('deviceorientation', function(e){
  if(e.gamma===null) return;
  lookTX = Math.max(-1, Math.min(1, e.gamma/28));
  lookTY = Math.max(-1, Math.min(1, (e.beta-45)/32));
});

// ---------- animation ----------
var BEAT_PERIOD = 0.92;                 // ~65 bpm, humanized per beat
var camU = 0, beatT = 0.6, beatKick = 0, speedSm = 22, pulseSm = 0, bankSm = 0;
var waveOrigin = -9999, waveAge = 99;   // heartbeat contraction wave along the wall
var frameAcc = 0, frameN = 0, dprIdx = 0;              // adaptive resolution governor
var DPR_LEVELS = [1.5, 1.25, 1.0, 0.8, 0.66];
function applyDPR(){
  renderer.setPixelRatio(Math.min(window.devicePixelRatio||1, DPR_LEVELS[dprIdx]));
  renderer.setSize(window.innerWidth, window.innerHeight);
  if(composer){
    // r134 composer caches its pixel ratio at construction — refresh it or the
    // governor only shrinks the final blit while every pass stays full-res
    composer._pixelRatio = renderer.getPixelRatio();
    composer.setSize(window.innerWidth, window.innerHeight);
    bloom.setSize(960, 540);
    if(bokehPass) bokehPass.uniforms['aspect'].value = camera.aspect;
  }
}
var clock = new THREE.Clock();
var _N=new THREE.Vector3(), _B=new THREE.Vector3(), _T=new THREE.Vector3();
var _pos=new THREE.Vector3(), _q=new THREE.Quaternion(), _m=new THREE.Matrix4(), _scl=new THREE.Vector3();
var _look=new THREE.Vector3(), _lookN=new THREE.Vector3(), _lookB=new THREE.Vector3();
var _ax=new THREE.Vector3(), _proj=new THREE.Vector3();
var _q2=new THREE.Quaternion(), _R=new THREE.Vector3(), _up=new THREE.Vector3(0,1,0);
var _lookSm=new THREE.Vector3(); var lookInit=false;

function radialAt(u, th, out){        // outward radial direction at (u, theta)
  var f=wrap01(u)*FRAME_SEGS, i0=Math.floor(f), a=f-i0;
  var j0=(i0%FRAME_SEGS)*3, j1=((i0+1)%FRAME_SEGS)*3;
  var ct=Math.cos(th), st=Math.sin(th);
  out.set(
    (norT[j0]  +(norT[j1]  -norT[j0]  )*a)*ct + (binT[j0]  +(binT[j1]  -binT[j0]  )*a)*st,
    (norT[j0+1]+(norT[j1+1]-norT[j0+1])*a)*ct + (binT[j0+1]+(binT[j1+1]-binT[j0+1])*a)*st,
    (norT[j0+2]+(norT[j1+2]-norT[j0+2])*a)*ct + (binT[j0+2]+(binT[j1+2]-binT[j0+2])*a)*st
  ).normalize();
}
// shared orientation: a reduced-amplitude tumble composed with flow alignment
// (disc plane parallel to the current, normal radial, slow wobble). Composing
// is continuous in time — slerping absolute rotations pops at hemisphere flips.
function axisAt(u, out){          // tube axis direction at u
  var f=wrap01(u)*FRAME_SEGS, i0=Math.floor(f), a=f-i0;
  var j0=(i0%FRAME_SEGS)*3, j1=((i0+1)%FRAME_SEGS)*3;
  out.set(tanT[j0]+(tanT[j1]-tanT[j0])*a, tanT[j0+1]+(tanT[j1+1]-tanT[j0+1])*a,
          tanT[j0+2]+(tanT[j1+2]-tanT[j0+2])*a).normalize();
}
function cellQuat(u, th, axis, spin, seed, align, phase){
  axisAt(u, _R);                     // disc normal along the flow: faces toward the viewer
  _R.x += Math.sin(seed)*0.45; _R.y += Math.cos(seed*0.9)*0.45; _R.z += Math.sin(seed*1.3)*0.3;
  _R.normalize();
  _q2.setFromUnitVectors(_up, _R);
  _q.setFromAxisAngle(axis, (phase*spin*(1.0-align)) % 6.2832);
  _q.premultiply(_q2);
  return _q;
}

function placeOnCurve(u, r, th, out){
  // fully inlined table lerp: position + normal/binormal offsets, zero allocations
  var f = wrap01(u)*FRAME_SEGS, i0 = Math.floor(f), a = f - i0;
  var j0 = (i0%FRAME_SEGS)*3, j1 = ((i0+1)%FRAME_SEGS)*3;
  var cr = Math.cos(th)*r, sr = Math.sin(th)*r;
  out.set(
    posT[j0]  +(posT[j1]  -posT[j0]  )*a + (norT[j0]  +(norT[j1]  -norT[j0]  )*a)*cr + (binT[j0]  +(binT[j1]  -binT[j0]  )*a)*sr,
    posT[j0+1]+(posT[j1+1]-posT[j0+1])*a + (norT[j0+1]+(norT[j1+1]-norT[j0+1])*a)*cr + (binT[j0+1]+(binT[j1+1]-binT[j0+1])*a)*sr,
    posT[j0+2]+(posT[j1+2]-posT[j0+2])*a + (norT[j0+2]+(norT[j1+2]-norT[j0+2])*a)*cr + (binT[j0+2]+(binT[j1+2]-binT[j0+2])*a)*sr
  );
}

function tick(){
  requestAnimationFrame(tick);
  var dt = Math.min(clock.getDelta(), 0.05);
  var t = clock.elapsedTime;

  // heartbeat drives the flow — endless
  beatT -= dt;
  if(beatT<=0){
    beatT += BEAT_PERIOD*(0.97+Math.random()*0.06);  // gently humanized rhythm
    thump();
    beatKick += reducedMotion?2.5:6.5;
    waveOrigin = camU*curveLen - 8;                  // launch a contraction wave
    waveAge = 0;
  }
  beatKick *= Math.pow(0.08, dt);
  var pulse = Math.min(1, beatKick/6.5);
  // visuals ride a smoothed pulse — the raw impulse is a lurch, not a surge
  pulseSm += (pulse-pulseSm)*Math.min(1, dt*(pulse>pulseSm?9:2.2));

  // wall squeeze wave sweeps forward past the camera
  waveAge += dt;
  if(wallMat.userData.shader){
    var ws = wallMat.userData.shader.uniforms;
    ws.uWavePos.value = waveOrigin + waveAge*105;
    ws.uWaveAmp.value = Math.exp(-waveAge*1.15) * (reducedMotion?0.4:1.0);
  }

  var speed = (reducedMotion?20:32) + beatKick*1.6;
  speedSm += (speed-speedSm)*Math.min(1,dt*2.5);
  camU = wrap01(camU + speedSm*dt/curveLen);

  // camera: wander off-center so the wall looms past, gaze lags into bends
  var u = camU;
  frameAt(u,_N,_B,_T);
  pointAt(u, camera.position);
  var wander = reducedMotion ? 0.5 : 1.0;
  camera.position.addScaledVector(_N, (Math.sin(t*0.31)*0.25 + Math.sin(t*0.071)*0.7)*wander);
  camera.position.addScaledVector(_B, (Math.cos(t*0.23)*0.25 + Math.cos(t*0.059)*0.7)*wander);
  pointAt(u + 14/curveLen, _look);
  frameAt(u + 14/curveLen, _lookN, _lookB);
  _look.addScaledVector(_lookN, Math.sin(t*0.19)*0.8);
  _look.addScaledVector(_lookB, Math.cos(t*0.15)*0.8);
  if(!lookInit){ _lookSm.copy(_look); lookInit=true; }
  _lookSm.lerp(_look, Math.min(1, dt*1.8));      // the head turns late into bends
  camera.lookAt(_lookSm);
  // bank into the turn: the lag between instant and smoothed gaze IS the curve
  _ax.set(1,0,0).applyQuaternion(camera.quaternion);
  _R.copy(_look).sub(_lookSm);
  var bankTarget = Math.max(-0.4, Math.min(0.4, -_R.dot(_ax)*0.12));
  bankSm += (bankTarget-bankSm)*Math.min(1, dt*2.5);
  if(!reducedMotion){
    camera.rotateZ(bankSm + Math.sin(t*0.21)*0.06 + t*0.045);
  }
  // gaze follows the mouse / device tilt
  lookX += (lookTX-lookX)*Math.min(1, dt*2.5);
  lookY += (lookTY-lookY)*Math.min(1, dt*2.5);
  camera.rotateY(-lookX*0.30);
  camera.rotateX(-lookY*0.22);
  // velocity widens the view — continuous, never a per-beat pump
  camera.fov = 80 + Math.min(reducedMotion?6:12, Math.max(0, speedSm-16)*0.5);
  camera.updateProjectionMatrix();
  if(bokehPass && !reducedMotion){
    // heartbeat rack focus: the eye refocuses slightly with each pulse
    bokehPass.materialBokeh.uniforms['focus'].value = 9.0 - pulseSm*1.2;
  }

  // lights ride with the camera
  keyLight.position.copy(camera.position);
  keyLight.position.addScaledVector(_N, 0.9).addScaledVector(_B, 0.6);
  keyLight.intensity = 1.6 + pulseSm*0.4;
  placeOnCurve(u + 20/curveLen, 0, 0, backLight.position);
  backLight.intensity = 8.0 + pulseSm*4.0;
  placeOnCurve(u + 30/curveLen, 0, 0, murk.position);
  murk.material.opacity = 0.80 + pulseSm*0.15;

  // shader uniforms
  var mats=[rbcMat, platMat, wbcMat];
  for(var mi2=0;mi2<3;mi2++){
    var uni = mats[mi2].uniforms;
    uni.uTime.value=t; uni.uPulse.value=pulseSm;
    uni.uCamPos.value.copy(camera.position);
    uni.uKeyPos.value.copy(keyLight.position);
    uni.uBackPos.value.copy(backLight.position);
  }

  var camDist = camU*curveLen;

  // red cells
  for(var i=0;i<COUNTS.cells;i++){
    var cd=cellData[i];
    if(cd.leader !== undefined){
      // rouleaux member: ride the leader's frame, offset along the disc axis
      var ld=cellData[cd.leader];
      var lu=(camDist+ld.s)/curveLen;
      placeOnCurve(lu, ld.r + Math.sin(t*0.6 + cd.leader*1.7)*0.22, ld.th, _pos);
      cellQuat(lu, ld.th, ld.axis, ld.spin, t*1.2+ld.wob, ld.align, t+cd.leader);
      _ax.set(0,1,0).applyQuaternion(_q);
      _pos.addScaledVector(_ax, cd.off*0.55*ld.sc);
      var nearM = Math.min(1, Math.max(0.30, (Math.abs(ld.s)-0.7)/2.2));
      _scl.setScalar(ld.sc*nearM);
      _m.compose(_pos,_q,_scl);
      cells.setMatrixAt(i,_m);
      continue;
    }
    cd.s += speedSm*(cd.flow-1)*dt;
    cd.th += 0.06*dt;
    if(cd.s> AHEAD)  cd.s -= WINDOW;
    if(cd.s<-BEHIND) cd.s += WINDOW;
    // slow radial breathing so cells never look rail-mounted
    var rEff = cd.r + Math.sin(t*0.6 + i*1.7)*0.22;
    var cu2=(camDist+cd.s)/curveLen;
    placeOnCurve(cu2, rEff, cd.th, _pos);
    cellQuat(cu2, cd.th, cd.axis, cd.spin, t*1.2+cd.wob, cd.align, t+i);
    var near = Math.min(1, Math.max(0.30, (Math.abs(cd.s)-0.7)/2.2));
    _scl.setScalar(cd.sc*near);
    _m.compose(_pos,_q,_scl);
    cells.setMatrixAt(i,_m);
  }
  cells.instanceMatrix.needsUpdate = true;

  // platelets
  for(var j=0;j<COUNTS.platelets;j++){
    var pd=platData[j];
    pd.s += speedSm*(pd.flow-1)*dt;
    pd.th += 0.11*dt;
    if(pd.s> AHEAD)  pd.s -= WINDOW;
    if(pd.s<-BEHIND) pd.s += WINDOW;
    placeOnCurve((camDist+pd.s)/curveLen, pd.r, pd.th, _pos);
    _q.setFromAxisAngle(pd.axis, (t+j)*pd.spin % 6.283);
    _scl.setScalar(Math.min(1, Math.max(0.30, (Math.abs(pd.s)-0.7)/2.2)));
    _m.compose(_pos,_q,_scl);
    plats.setMatrixAt(j,_m);
  }
  plats.instanceMatrix.needsUpdate = true;

  // bacteria: jitter along near the wall; respawn a while after being eaten
  for(var q=0;q<bacteria.length;q++){
    var bd2=bacteria[q];
    if(!bd2.alive){
      if(t > bd2.respawnAt){
        bd2.alive = true; bd2.mesh.visible = true;
        bd2.s = AHEAD-6; bd2.th = Math.random()*6.283; bd2.r = VESSEL_R-3.0;
      }else{ continue; }
    }
    bd2.s += speedSm*(0.55-1)*dt;
    bd2.th += Math.sin(t*6.5+bd2.ph)*0.7*dt;
    bd2.r = VESSEL_R-3.0 + Math.sin(t*2.1+bd2.ph)*0.5;
    if(bd2.s> AHEAD)  bd2.s -= WINDOW;
    if(bd2.s<-BEHIND) bd2.s += WINDOW;
    placeOnCurve((camDist+bd2.s)/curveLen, bd2.r, bd2.th, bd2.mesh.position);
    bd2.mesh.rotation.set(t*1.7+bd2.ph, bd2.ph, t*2.3);
    bd2.mesh.scale.setScalar(Math.min(1, Math.max(0.05, (Math.abs(bd2.s)-0.8)/2.5)));
  }

  // white cells hunt: drift toward the nearest bacterium and engulf it
  for(var k=0;k<whites.length;k++){
    var wd=whites[k];
    wd.s += speedSm*(wd.flow-1)*dt;
    if(wd.s> AHEAD)  wd.s -= WINDOW;
    if(wd.s<-BEHIND) wd.s += WINDOW;
    var prey=null, best=13;
    for(var q2=0;q2<bacteria.length;q2++){
      var cand=bacteria[q2];
      if(!cand.alive) continue;
      var ds=Math.abs(cand.s-wd.s);
      if(ds<best){ best=ds; prey=cand; }
    }
    if(prey){
      wd.s += Math.max(-1,Math.min(1,(prey.s-wd.s)))*dt*(0.5 + speedSm*0.06);
      var dth=((prey.th-wd.th)%6.2832+9.4248)%6.2832-3.1416;
      wd.th += Math.max(-1,Math.min(1,dth))*dt*0.9;
      wd.r += (prey.r-wd.r)*Math.min(1,dt*0.8);
    }
    placeOnCurve((camDist+wd.s)/curveLen, wd.r, wd.th, wd.mesh.position);
    if(prey && wd.mesh.position.distanceTo(prey.mesh.position) < 1.25){
      prey.alive=false; prey.mesh.visible=false;
      prey.respawnAt = t + 7 + Math.random()*9;
      wd.gulp = 1;                                    // swallow throb
    }
    wd.gulp *= Math.pow(0.25, dt);
    var wScale = Math.min(1, Math.max(0.15, (Math.abs(wd.s)-1.2)/4.5));
    wd.mesh.scale.setScalar(wScale*(1 + wd.gulp*0.28*Math.sin((1-wd.gulp)*9.0)));
    wd.mesh.rotation.x += 0.28*dt; wd.mesh.rotation.y += 0.17*dt;
  }

  // micro-particles
  for(var m2=0;m2<COUNTS.micro;m2++){
    var md=microData[m2];
    md.s += speedSm*(md.flow-1)*dt;
    if(md.s> AHEAD)  md.s -= WINDOW;
    if(md.s<-BEHIND) md.s += WINDOW;
    // size-attenuated points balloon at near-zero depth: hop over the lens zone
    if(md.s > -1.5 && md.s < 1.5) md.s = -1.5;
    placeOnCurve((camDist+md.s)/curveLen, md.r, md.th, _pos);
    microPos[m2*3]=_pos.x; microPos[m2*3+1]=_pos.y; microPos[m2*3+2]=_pos.z;
  }
  microGeo.attributes.position.needsUpdate = true;

  // bokeh blobs drift past the lens
  for(var b=0;b<bokehs.length;b++){
    var bk=bokehs[b], sp2=bk.spr;
    sp2.position.x += bk.vx*dt;
    sp2.position.y += bk.vy*dt;
    sp2.position.z += bk.vz*dt*(0.4 + speedSm*0.04);
    if(sp2.position.z > -2.5){    // respawn before it becomes a full-screen wash
      sp2.position.set((Math.random()-0.5)*9,(Math.random()-0.5)*6,-(8+Math.random()*4));
    }
  }

  // --- audio follows the flow ---
  if(AC && whooshGain){
    whooshGain.gain.setTargetAtTime(0.10+Math.min(0.25, speedSm/70*0.3), AC.currentTime, 0.15);
    whooshFilter.frequency.setTargetAtTime(240+speedSm*22+pulseSm*260, AC.currentTime, 0.1);
    if(whooshPan) whooshPan.pan.setTargetAtTime(Math.sin(t*0.21)*0.35, AC.currentTime, 0.25);
  }

  if(composer){
    // aim the god rays at the backlight's screen position, fading it off-screen
    camera.updateMatrixWorld();
    _proj.copy(backLight.position).project(camera);
    var edge = Math.max(Math.abs(_proj.x), Math.abs(_proj.y));
    var fade = _proj.z < 1 ? 1 - Math.min(1, Math.max(0, (edge-1)/0.4)) : 0;
    gradePass.uniforms.uLight.value.set(_proj.x*0.5+0.5, _proj.y*0.5+0.5);
    gradePass.uniforms.uRays.value = fade * (0.60 + pulseSm*1.1);
    gradePass.uniforms.uZoom.value = reducedMotion ? 0 :
      Math.min(0.011, Math.max(0,(speedSm-24)*0.00035)) + pulseSm*0.003;
    gradePass.uniforms.uTime.value=t;
    gradePass.uniforms.uPulse.value=pulseSm;
    composer.render();
  }else{
    renderer.render(scene,camera);
  }

  // adaptive resolution: keep the frame budget on unknown venue hardware
  frameAcc += dt; frameN++;
  if(frameN >= 60){
    var avg = frameAcc/frameN; frameAcc = 0; frameN = 0;
    if(avg > 0.021 && dprIdx < DPR_LEVELS.length-1){ dprIdx++; applyDPR(); }
    else if(avg > 0.021 && bokehPass && bokehPass.enabled){ bokehPass.enabled = false; }
    else if(avg < 0.012 && dprIdx > 0){ dprIdx--; applyDPR(); }
  }
}
tick();

window.addEventListener('resize', function(){
  camera.aspect = window.innerWidth/window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
  if(composer){
    composer.setSize(window.innerWidth, window.innerHeight);
    bloom.setSize(960, 540);              // keep the mip chain pinned
    if(bokehPass) bokehPass.uniforms['aspect'].value = camera.aspect;
    gradePass.uniforms.uRes.value.set(window.innerWidth, window.innerHeight);
  }
});
})();
</script>
