<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Photodome GLB builder</title>
<style>html,body{margin:0;background:#111}canvas{display:block}</style>
<script type="importmap">
{ "imports": { "three": "./vendor/three/build/three.module.min.js" } }
</script>
</head>
<body>
<script type="module">
import * as THREE from 'three';
import { GLTFExporter } from './vendor/three/examples/jsm/exporters/GLTFExporter.js';
import { GLTFLoader } from './vendor/three/examples/jsm/loaders/GLTFLoader.js';

const status = (window.__status = { stage: 'loading' });
const params = new URLSearchParams(location.search);
const IMG_URL = params.get('img');
const DOME_NAME = params.get('name') || 'photodome';
const EYE = 1.6;           // dome center height: matches standing avatar eye height
const RADIUS = 25;         // dome radius in meters
const SEAM = 48;           // seam crossfade width in px
const YAW = parseFloat(params.get('yaw') || '0');   // rotate pano so best content faces forward
const PLATFORM = 2.2;      // standing platform radius (small: must not hide the pano)

try {
  // ---- 1. Load the equirectangular image and blend the wrap seam ----
  const img = await new Promise((res, rej) => {
    const i = new Image();
    i.onload = () => res(i); i.onerror = rej;
    i.src = IMG_URL;
  });
  const W = img.naturalWidth, H = img.naturalHeight;
  const c = document.createElement('canvas');
  c.width = W; c.height = H;
  const g = c.getContext('2d', { willReadFrequently: true });
  g.drawImage(img, 0, 0);

  // Crossfade left/right edges so the sphere wrap has no hard seam.
  const data = g.getImageData(0, 0, W, H);
  const px = data.data;
  for (let y = 0; y < H; y++) {
    for (let s = 0; s < SEAM; s++) {
      const t = s / SEAM;                    // 0 at edge -> 1 inward
      const w = 0.5 * (1 - t);               // blend weight of opposite edge
      const li = (y * W + s) * 4;
      const ri = (y * W + (W - 1 - s)) * 4;
      for (let ch = 0; ch < 3; ch++) {
        const a = px[li + ch], b = px[ri + ch];
        px[li + ch] = a * (1 - w) + b * w;
        px[ri + ch] = b * (1 - w) + a * w;
      }
    }
  }
  g.putImageData(data, 0, 0);

  // Sample the bottom pole colors for the floor.
  const bot = g.getImageData(0, H - Math.floor(H * 0.06), W, Math.floor(H * 0.06)).data;
  let r = 0, gr = 0, b = 0, n = 0;
  for (let i = 0; i < bot.length; i += 40) { r += bot[i]; gr += bot[i + 1]; b += bot[i + 2]; n++; }
  const floorCol = new THREE.Color(r / n / 255, gr / n / 255, b / n / 255);

  // ---- 2. Build the dome scene ----
  status.stage = 'building';
  const scene = new THREE.Scene();
  scene.name = DOME_NAME;

  const tex = new THREE.CanvasTexture(c);
  tex.colorSpace = THREE.SRGBColorSpace;
  tex.userData.mimeType = 'image/jpeg';      // GLTFExporter embeds as JPEG
  const domeGeo = new THREE.SphereGeometry(RADIUS, 64, 32);
  domeGeo.scale(-1, 1, 1);                   // bake inversion: texture faces inward
  const dome = new THREE.Mesh(domeGeo, new THREE.MeshBasicMaterial({ map: tex }));
  dome.name = DOME_NAME + '-dome';
  dome.position.y = EYE;
  dome.rotation.y = THREE.MathUtils.degToRad(YAW);
  scene.add(dome);

  // Walkable floor disc at y=0 (radial gradient from sampled pole color).
  const fc = document.createElement('canvas');
  fc.width = fc.height = 512;
  const fg = fc.getContext('2d');
  // Radial color + alpha: solid center fading to fully transparent at the rim,
  // so the platform melts into the panorama instead of cutting it off.
  const grad = fg.createRadialGradient(256, 256, 20, 256, 256, 250);
  const c2 = floorCol.clone().multiplyScalar(1.12);
  grad.addColorStop(0, '#' + c2.getHexString() + 'ff');
  grad.addColorStop(0.55, '#' + floorCol.getHexString() + 'e6');
  grad.addColorStop(0.82, '#' + floorCol.clone().multiplyScalar(0.8).getHexString() + '66');
  grad.addColorStop(1, '#' + floorCol.getHexString() + '00');
  fg.clearRect(0, 0, 512, 512);
  fg.fillStyle = grad; fg.fillRect(0, 0, 512, 512);
  const floorTex = new THREE.CanvasTexture(fc);   // has alpha -> exporter keeps PNG
  floorTex.colorSpace = THREE.SRGBColorSpace;
  const floor = new THREE.Mesh(
    new THREE.CircleGeometry(PLATFORM, 48).rotateX(-Math.PI / 2),
    new THREE.MeshStandardMaterial({ map: floorTex, transparent: true, roughness: 0.85, metalness: 0 })
  );
  floor.name = DOME_NAME + '-floor';
  floor.position.y = 0.01;
  scene.add(floor);

  // ---- 3. Export GLB ----
  status.stage = 'exporting';
  const glb = await new Promise((res, rej) =>
    new GLTFExporter().parse(scene, res, rej, { binary: true, maxTextureSize: 4096 }));
  status.glbBytes = glb.byteLength;
  const u8 = new Uint8Array(glb);
  let bin = '';
  for (let i = 0; i < u8.length; i += 0x8000) bin += String.fromCharCode.apply(null, u8.subarray(i, i + 0x8000));
  status.glbB64 = btoa(bin);

  // ---- 4. Round-trip: reload the GLB and render from inside ----
  status.stage = 'reimporting';
  const gltf = await new GLTFLoader().parseAsync(glb.slice(0), '');
  const view = new THREE.Scene();
  view.add(gltf.scene);
  view.add(new THREE.HemisphereLight(0xffffff, 0x886655, 2.2)); // lights the floor (dome is unlit)

  const renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setSize(900, 500);
  document.body.appendChild(renderer.domElement);
  const cam = new THREE.PerspectiveCamera(80, 900 / 500, 0.05, 100);
  cam.position.set(0, EYE, 0);

  window.__renderView = (yawDeg, pitchDeg = 0) => {
    cam.rotation.set(0, 0, 0);
    cam.rotateY(THREE.MathUtils.degToRad(yawDeg));
    cam.rotateX(THREE.MathUtils.degToRad(pitchDeg));
    renderer.render(view, cam);
  };
  window.__renderView(0, 0);
  status.stage = 'done';
} catch (e) {
  status.stage = 'error';
  status.error = String(e && e.stack || e);
}
</script>
</body>
</html>
