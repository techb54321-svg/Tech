plugins {
    id 'com.android.application'
}

android {
    namespace 'com.scrollbouncer.app'
    compileSdk 36

    defaultConfig {
        applicationId 'com.scrollbouncer.app'
        minSdk 26
        targetSdk 36
        versionCode 8
        versionName '1.6.0'
    }

    // A development key kept in the project, so every build of the downloadable app
    // installs over the last one. The Google Play build is signed with a private upload
    // key instead, which is never kept here: pass its file and password when building,
    //   ./gradlew bundlePlay -PuploadKeystore=/path/to/upload.jks -PuploadPassword=...
    // (see ../mr-blocky-store/README.md).
    def uploadKeystore = project.findProperty('uploadKeystore')
    signingConfigs {
        dev {
            storeFile rootProject.file('dev.keystore')
            storePassword 'scrollbouncer'
            keyAlias 'dev'
            keyPassword 'scrollbouncer'
        }
        if (uploadKeystore) {
            upload {
                storeFile file(uploadKeystore)
                storePassword project.findProperty('uploadPassword')
                keyAlias 'upload'
                keyPassword project.findProperty('uploadPassword')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.dev
        }
        // The same app for Google Play, as an app bundle (bundlePlay), signed with the upload key.
        play {
            initWith release
            signingConfig uploadKeystore ? signingConfigs.upload : null
        }
        debug {
            signingConfig signingConfigs.dev
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    // The little guy is drawn by guy.js, the same file the browser extension uses.
    sourceSets.main.assets.srcDirs += layout.buildDirectory.dir('generated/guy').get().asFile

    lint {
        abortOnError true
        checkReleaseBuilds true
    }
}

def copyGuy = tasks.register('copyGuy', Copy) {
    from rootProject.file('../mr-blocky/guy.js'), rootProject.file('../mr-blocky/dance.ogg')
    into layout.buildDirectory.dir('generated/guy')
}
tasks.named('preBuild') { dependsOn copyGuy }
