<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mr Blocky</title>
<style>html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; }</style>
</head>
<body>
<script src="guy.js"></script>
<script>
  // Shown by the Android app in a see-through layer over whatever is on screen.
  // After the # come: top, where the status bar ends, so he walks just underneath it;
  // deal=1 if he offers the dance deal; and line, if he says something other than
  // "Nope not now".
  (async () => {
    const options = new URLSearchParams(location.hash.slice(1));
    try {
      console.log('Mr Blocky: page ready');
      const top = Number(options.get('top')) || 0;
      const show = await ScrollBouncerGuy.perform({
        top: top + 8, line: options.get('line') || undefined, onDark: () => Android.dark()
      });
      if (options.get('deal') === '1') {
        // On a phone he checks they really do the star jumps and knees up, with its
        // motion sensor. The app calls mrBlockyMove() for each one it feels.
        let kind = '', counted = 0;
        const counter = Android.hasMotion() ? {
          hint: 'Hold on to your phone!',
          start(move, onCount) {
            kind = move;
            counted = 0;
            window.mrBlockyMove = () => { counted += 1; onCount(); };
            Android.countMoves(move, true);
          },
          stop() {
            Android.countMoves('', false);
            window.mrBlockyMove = null;
            console.log('Mr Blocky: counted ' + counted + ' ' + kind);
          }
        } : undefined;
        const answer = await show.offerDance({
          music: 'dance.ogg', counter, onDancing: () => Android.dancing(), onLetIn: () => Android.letIn()
        });
        console.log('Mr Blocky: deal ' + answer);
      }
      await show.fadeOut();
    } finally {
      Android.done();
    }
  })();
</script>
</body>
</html>
