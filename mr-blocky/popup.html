<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mr Blocky</title>
<style>
  :root { --bg:#f6fbfa; --fg:#12211f; --muted:#5b706c; --line:#dce8e5; --accent:#0f766e; --on-accent:#fff; --chip:#fff; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#131f1d; --fg:#f1f7f5; --muted:#9bb0ab; --line:#2c3d3a; --accent:#2dd4bf; --on-accent:#06302c; --chip:#1b2b28; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; width: 320px; max-width: 100%; padding: 16px; background: var(--bg); color: var(--fg);
    font: 14px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; }
  header { display: flex; align-items: center; gap: 10px; }
  header img { width: 36px; height: 36px; }
  h1 { font-size: 16px; margin: 0; flex: 1; }
  .switch { position: relative; width: 44px; height: 24px; flex: none; }
  .switch input { opacity: 0; width: 100%; height: 100%; margin: 0; cursor: pointer; position: absolute; z-index: 1; }
  .switch span { position: absolute; inset: 0; border-radius: 12px; background: var(--line); transition: background .15s; }
  .switch span::after { content: ""; position: absolute; top: 3px; left: 3px; width: 18px; height: 18px;
    border-radius: 50%; background: #fff; transition: transform .15s; }
  .switch input:checked + span { background: var(--accent); }
  .switch input:checked + span::after { transform: translateX(20px); }
  .switch input:focus-visible + span { outline: 2px solid var(--accent); outline-offset: 2px; }
  .stats { margin: 14px 0; padding: 12px; border: 1px solid var(--line); border-radius: 10px; display: flex; gap: 16px; }
  .stats b { display: block; font-size: 22px; font-variant-numeric: tabular-nums; }
  .stats span { color: var(--muted); font-size: 12px; }
  h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 0 0 8px; }
  ul { list-style: none; margin: 0 0 10px; padding: 0; display: flex; flex-wrap: wrap; gap: 6px; }
  li { display: flex; align-items: center; gap: 4px; padding: 3px 4px 3px 10px; border: 1px solid var(--line);
    border-radius: 999px; background: var(--chip); font-size: 13px; }
  li button { border: 0; background: none; color: var(--muted); cursor: pointer; font-size: 14px; padding: 2px 6px; border-radius: 50%; }
  li button:hover { color: var(--accent); }
  form { display: flex; gap: 6px; }
  input[type=text] { flex: 1; min-width: 0; padding: 7px 10px; border: 1px solid var(--line); border-radius: 8px;
    background: var(--chip); color: var(--fg); font: inherit; }
  button.btn { padding: 7px 12px; border: 0; border-radius: 8px; background: var(--accent); color: var(--on-accent); font: inherit;
    font-weight: 600; cursor: pointer; }
  button.ghost { width: 100%; margin-top: 14px; background: none; color: var(--fg); border: 1px solid var(--line); }
  #snoozeNote { color: var(--muted); font-size: 12px; margin: 6px 0 0; text-align: center; min-height: 1.4em; }
  .deal { margin-top: 6px; padding: 12px; border: 1px solid var(--line); border-radius: 10px; }
  .deal .row { display: flex; align-items: center; gap: 12px; }
  .deal .row div { flex: 1; }
  .deal small { display: block; color: var(--muted); font-size: 12px; margin-top: 2px; }
  .deal button.ghost { margin-top: 10px; }
</style>
</head>
<body>
  <header>
    <img src="icons/128.png" alt="">
    <h1>Mr Blocky</h1>
    <label class="switch" title="Turn Mr Blocky on or off">
      <input type="checkbox" id="enabled" aria-label="Mr Blocky on">
      <span></span>
    </label>
  </header>

  <div class="stats">
    <div><b id="today">0</b><span>closed today</span></div>
    <div><b id="total">0</b><span>all time</span></div>
  </div>

  <h2>Sites he closes</h2>
  <ul id="sites"></ul>
  <form id="add">
    <input type="text" id="site" placeholder="e.g. linkedin.com/feed" aria-label="Site to add" autocomplete="off">
    <button class="btn">Add</button>
  </form>

  <button class="btn ghost" id="snooze">Let me in for 5 minutes</button>
  <p id="snoozeNote"></p>

  <div class="deal">
    <div class="row">
      <div><b>Dance deals</b><small>Now and then he'll let you in for 5 minutes if you dance with him for one.</small></div>
      <label class="switch" title="Turn dance deals on or off">
        <input type="checkbox" id="danceDeals" aria-label="Dance deals on">
        <span></span>
      </label>
    </div>
    <button class="btn ghost" id="danceNext">Make the next one a dance</button>
  </div>

  <script src="defaults.js"></script>
  <script src="popup.js"></script>
</body>
</html>
