<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no" />
<meta name="theme-color" content="#f6f2ea" />
<title>Quick Quiz — Real Food Rewards</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<style>
  :root{
    --bg:#f6f2ea; --card:#ffffff; --ink:#1f2d24; --muted:#6b7d70;
    --green:#2f9e44; --green-d:#2b8a3e; --lime:#82c91e; --gold:#f5b100;
    --red:#e8590c; --line:#e7e0d3; --r:20px;
    --shadow:0 12px 30px -14px rgba(31,45,36,.28);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%}
  body{background:var(--bg);color:var(--ink);
    font-family:"Manrope",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
  #app{max-width:520px;margin:0 auto;min-height:100%;padding:0 18px calc(28px + env(safe-area-inset-bottom));display:flex;flex-direction:column}
  header{padding:calc(18px + env(safe-area-inset-top)) 2px 8px;display:flex;align-items:center;justify-content:space-between}
  .title{display:flex;align-items:center;gap:10px;font-weight:800;font-size:20px;letter-spacing:-.3px}
  .title .ic{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;font-size:20px;
    background:linear-gradient(150deg,#d3f9d8,#b2f2bb)}
  .pts-chip{display:flex;align-items:center;gap:6px;background:#fff;border:1px solid var(--line);
    padding:8px 12px;border-radius:999px;font-weight:800;font-size:14px;box-shadow:var(--shadow)}
  .pts-chip b{color:var(--green)}
  button{font-family:inherit;cursor:pointer;border:none;color:inherit;background:none}
  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}

  .progress{height:10px;border-radius:999px;background:#e9e2d5;overflow:hidden;margin:10px 2px 18px}
  .progress i{display:block;height:100%;background:linear-gradient(90deg,var(--lime),var(--green));border-radius:999px;transition:width .4s}

  .q{padding:22px 20px;animation:rise .35s ease both}
  @keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
  .q .num{font-size:12px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.4px}
  .q h2{margin:6px 0 18px;font-size:21px;line-height:1.25;letter-spacing:-.3px}
  .opts{display:flex;flex-direction:column;gap:10px}
  .opt{display:flex;align-items:center;gap:12px;padding:15px 16px;border-radius:14px;border:1.5px solid var(--line);
    background:#fff;font-weight:700;font-size:15px;text-align:left;transition:transform .12s, border-color .2s, background .2s}
  .opt:active{transform:scale(.98)}
  .opt .k{width:26px;height:26px;border-radius:8px;background:#f0ece2;display:grid;place-items:center;font-size:13px;font-weight:800;color:var(--muted);flex:none}
  .opt.correct{border-color:var(--green);background:#ebfbee}
  .opt.correct .k{background:var(--green);color:#fff}
  .opt.wrong{border-color:var(--red);background:#fff4ec}
  .opt.wrong .k{background:var(--red);color:#fff}
  .opt.dim{opacity:.55}
  .feedback{margin-top:16px;font-weight:700;font-size:14px;min-height:20px}
  .feedback.ok{color:var(--green)} .feedback.no{color:var(--red)}
  .next{margin-top:18px;width:100%;padding:15px;border-radius:14px;font-weight:800;font-size:16px;color:#fff;
    background:linear-gradient(150deg,var(--lime),var(--green) 60%,var(--green-d));box-shadow:0 10px 22px -8px rgba(47,158,68,.5)}
  .next:disabled{opacity:.4;box-shadow:none}
  .next:active{transform:scale(.98)}

  .result{padding:30px 22px;text-align:center;animation:rise .4s ease both}
  .result .big{font-size:54px}
  .result h2{margin:8px 0 4px;font-size:24px;letter-spacing:-.4px}
  .result .score{font-size:16px;color:var(--muted);font-weight:700}
  .result .earn{margin:16px auto 0;display:inline-block;background:#ebfbee;color:var(--green);border:1px solid #b2f2bb;
    padding:10px 18px;border-radius:999px;font-weight:800}
  .result .again{margin-top:22px;width:100%;padding:15px;border-radius:14px;font-weight:800;font-size:16px;color:#fff;
    background:linear-gradient(150deg,var(--lime),var(--green) 60%,var(--green-d));box-shadow:0 10px 22px -8px rgba(47,158,68,.5)}
  .result .home{margin-top:10px;font-weight:800;color:var(--green);font-size:14px}
  .foot{text-align:center;color:var(--muted);font-size:12px;margin-top:auto;padding-top:24px}

  #fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:50}
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="title"><span class="ic">❓</span> Quick Quiz</div>
    <div class="pts-chip">⭐ <b id="ptsTop">0</b></div>
  </header>
  <div class="progress"><i id="prog" style="width:0%"></i></div>
  <div id="stage"></div>
  <div class="foot">Test what you know · earn ⭐ points</div>
</div>
<canvas id="fx"></canvas>

<script>
(function(){
  "use strict";

  /* ---- shared points wallet (same origin as the main app) ---- */
  var KEY="rfr_state_v1";
  function today(){var d=new Date();return d.getFullYear()+"-"+(d.getMonth()+1)+"-"+d.getDate();}
  function fresh(){return {points:0,totalLogs:0,vegLogs:0,waterLogs:0,bestStreak:0,streak:0,
    lastDay:null,goalsHit:0,owned:[],day:{date:today(),logs:[],points:0,counts:{}}};}
  function load(){try{var s=JSON.parse(localStorage.getItem(KEY));if(!s)return fresh();
    if(!s.day||s.day.date!==today())s.day={date:today(),logs:[],points:0,counts:{}};return s;}catch(e){return fresh();}}
  function award(pts,emoji,name){try{var S=load();S.points+=pts;S.day.points+=pts;
    S.day.logs.unshift({e:emoji,n:name,p:pts});localStorage.setItem(KEY,JSON.stringify(S));return S.points;}catch(e){return pts;}}
  function totalPoints(){return load().points;}
  document.getElementById("ptsTop").textContent=totalPoints();

  /* ---- questions ---- */
  var Q=[
    {q:"Which food helps build strong bones?",a:["Fizzy cola","Yogurt","Crisps","Sweets"],c:1},
    {q:"Which drink has the least sugar?",a:["Water","Cola","Fruit juice","Energy drink"],c:0},
    {q:"A healthier swap for white rice is…",a:["Brown / wholegrain rice","Chips","White bread","Cake"],c:0},
    {q:"Which of these is a whole food?",a:["Instant noodles","Biscuits","An apple","Candy"],c:2},
    {q:"About how much of your plate should be veg & fruit?",a:["None","A tiny bit","About half","All meat"],c:2},
    {q:"Which snack is lowest in sugar?",a:["A handful of nuts","Chocolate bar","Sweet biscuits","Fizzy drink"],c:0},
    {q:"On a label, sugar is 'high' at roughly…",a:["0g per 100g","1g per 100g","5g per 100g","Over 22.5g per 100g"],c:3},
    {q:"Best everyday way to stay hydrated?",a:["Water","Sugary juice","Energy drink","Soda"],c:0}
  ];
  var PER=5; // points per correct answer
  var idx=0, correct=0, answered=false;

  var stage=document.getElementById("stage"), prog=document.getElementById("prog");

  function renderQ(){
    answered=false;
    prog.style.width=(idx/Q.length*100)+"%";
    var item=Q[idx];
    var letters=["A","B","C","D"];
    var html='<div class="q card"><div class="num">Question '+(idx+1)+' of '+Q.length+'</div>'+
      '<h2>'+item.q+'</h2><div class="opts">';
    item.a.forEach(function(opt,i){
      html+='<button class="opt" data-i="'+i+'"><span class="k">'+letters[i]+'</span>'+opt+'</button>';
    });
    html+='</div><div class="feedback" id="fb"></div>'+
      '<button class="next" id="next" disabled>'+(idx===Q.length-1?"See results":"Next")+'</button></div>';
    stage.innerHTML=html;
    var opts=stage.querySelectorAll(".opt");
    opts.forEach(function(b){ b.onclick=function(){ pick(parseInt(b.getAttribute("data-i"),10), opts); }; });
    document.getElementById("next").onclick=nextQ;
  }
  function pick(i, opts){
    if(answered) return; answered=true;
    var item=Q[idx], fb=document.getElementById("fb");
    opts.forEach(function(b){
      var bi=parseInt(b.getAttribute("data-i"),10);
      if(bi===item.c) b.classList.add("correct");
      else if(bi===i) b.classList.add("wrong");
      else b.classList.add("dim");
    });
    if(i===item.c){ correct++; fb.textContent="Correct! +"+PER+" ⭐"; fb.className="feedback ok"; }
    else { fb.textContent="Not quite — the answer is "+item.a[item.c]+"."; fb.className="feedback no"; }
    document.getElementById("next").disabled=false;
  }
  function nextQ(){
    if(idx<Q.length-1){ idx++; renderQ(); }
    else finish();
  }
  function finish(){
    prog.style.width="100%";
    var earned=correct*PER;
    var newTotal=award(earned, "❓", "Quick Quiz ("+correct+"/"+Q.length+")");
    document.getElementById("ptsTop").textContent=newTotal;
    var emoji = correct===Q.length ? "🏆" : correct>=Q.length*0.6 ? "🌟" : "🌱";
    var msg = correct===Q.length ? "Perfect score!" : correct>=Q.length*0.6 ? "Nicely done!" : "Good try!";
    stage.innerHTML='<div class="result card"><div class="big">'+emoji+'</div>'+
      '<h2>'+msg+'</h2><div class="score">You got '+correct+' of '+Q.length+' right</div>'+
      '<div class="earn">+'+earned+' points earned ⭐</div>'+
      '<button class="again" id="again">Play again</button>'+
      '<div class="home">Tip: spend your points in Rewards 🎁</div></div>';
    document.getElementById("again").onclick=function(){ idx=0; correct=0; renderQ(); };
    if(correct>=Q.length*0.6) confetti(90);
  }

  /* ---- confetti ---- */
  var fxC=document.getElementById("fx"), fxX=(fxC&&fxC.getContext)?fxC.getContext("2d"):null, P=[], raf=null;
  var COL=["#2f9e44","#82c91e","#f5b100","#e8590c","#4dabf7"];
  function rs(){ if(!fxX)return; fxC.width=window.innerWidth; fxC.height=window.innerHeight; }
  if(fxX){ rs(); window.addEventListener("resize",rs); }
  function confetti(n){ if(!fxX)return; for(var i=0;i<n;i++){P.push({x:window.innerWidth/2+(Math.random()*2-1)*70,
    y:window.innerHeight*0.4,vx:(Math.random()*2-1)*7,vy:-(6+Math.random()*8),g:0.24+Math.random()*0.12,
    s:5+Math.random()*6,c:COL[(i*7)%COL.length],r:Math.random()*6,vr:(Math.random()*2-1)*0.4,life:1});}
    if(!raf)raf=requestAnimationFrame(tick); }
  function tick(){ fxX.clearRect(0,0,fxC.width,fxC.height);
    for(var i=P.length-1;i>=0;i--){var p=P[i];p.vy+=p.g;p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;p.life-=0.008;
      if(p.y>fxC.height+24||p.life<=0){P.splice(i,1);continue;}
      fxX.save();fxX.globalAlpha=Math.max(0,p.life);fxX.translate(p.x,p.y);fxX.rotate(p.r);
      fxX.fillStyle=p.c;fxX.fillRect(-p.s/2,-p.s/2,p.s,p.s*0.62);fxX.restore();}
    if(P.length)raf=requestAnimationFrame(tick);else{raf=null;fxX.clearRect(0,0,fxC.width,fxC.height);} }

  renderQ();
})();
</script>
</body>
</html>
