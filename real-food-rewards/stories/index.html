<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no" />
<meta name="theme-color" content="#f6f2ea" />
<title>Stories &amp; Tips — Real Food Rewards</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<style>
  :root{
    --bg:#f6f2ea; --card:#ffffff; --ink:#1f2d24; --muted:#6b7d70;
    --green:#2f9e44; --green-d:#2b8a3e; --lime:#82c91e; --gold:#f5b100; --red:#e8590c;
    --line:#e7e0d3; --shadow:0 14px 34px -16px rgba(31,45,36,.32);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%}
  body{background:var(--bg);color:var(--ink);
    font-family:"Manrope",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
  #app{max-width:520px;margin:0 auto;min-height:100%;padding:0 18px calc(30px + env(safe-area-inset-bottom));display:flex;flex-direction:column}
  header{padding:calc(18px + env(safe-area-inset-top)) 2px 6px;display:flex;align-items:center;justify-content:space-between}
  .title{display:flex;align-items:center;gap:10px;font-weight:800;font-size:20px;letter-spacing:-.3px}
  .title .ic{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;font-size:20px;
    background:linear-gradient(150deg,#ffe8cc,#ffd8a8)}
  .pts-chip{display:flex;align-items:center;gap:6px;background:#fff;border:1px solid var(--line);
    padding:8px 12px;border-radius:999px;font-weight:800;font-size:14px;box-shadow:var(--shadow)}
  .pts-chip b{color:var(--green)}
  button{font-family:inherit;cursor:pointer;border:none;color:inherit;background:none;text-align:left}

  /* collection progress */
  .collect{margin:8px 2px 4px;display:flex;align-items:center;gap:12px}
  .collect .pbar{flex:1;height:10px;border-radius:999px;background:#e9e2d5;overflow:hidden}
  .collect .pbar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--lime),var(--green));border-radius:999px;transition:width .5s cubic-bezier(.2,.8,.2,1)}
  .collect .ctxt{font-size:12px;font-weight:800;color:var(--muted);white-space:nowrap}

  .sec{font-size:13px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.4px;margin:18px 2px 12px}

  /* illustrated cover cards */
  .ic2{background:#fff;border:1px solid var(--line);border-radius:24px;box-shadow:var(--shadow);overflow:hidden;margin-bottom:16px;
    width:100%;transition:transform .15s}
  .ic2:active{transform:scale(.985)}
  .banner{position:relative;width:100%;height:176px;display:block}
  .banner .illo{position:absolute;inset:0;width:100%;height:100%}
  .banner .scrim{position:absolute;left:0;right:0;bottom:0;height:72%;
    background:linear-gradient(to top,rgba(9,28,17,.86),rgba(9,28,17,.12) 62%,transparent)}
  .banner .cap{position:absolute;left:16px;right:16px;bottom:14px;color:#fff}
  .banner .kow{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.6px;opacity:.92}
  .banner .cap h3{margin:3px 0 0;font-family:"Fraunces",Georgia,serif;font-weight:700;font-size:22px;letter-spacing:-.2px;line-height:1.15;text-shadow:0 2px 10px rgba(0,0,0,.4)}
  .chip{position:absolute;top:13px;left:13px;background:rgba(255,255,255,.94);color:var(--green-d);
    font-size:11px;font-weight:800;padding:6px 11px;border-radius:999px;box-shadow:0 4px 10px rgba(0,0,0,.12)}
  .rtag{position:absolute;top:13px;right:13px;background:rgba(255,255,255,.94);color:var(--green);
    font-size:11px;font-weight:800;padding:6px 11px;border-radius:999px;box-shadow:0 4px 10px rgba(0,0,0,.12)}
  .rtag.done{color:var(--green-d)}
  .cue{padding:12px 18px;color:var(--muted);font-size:12.5px;font-weight:700;display:flex;align-items:center;gap:7px}

  /* featured */
  .feature .banner{height:220px}
  .feature .banner .cap h3{font-size:25px}
  .feature .claimrow{padding:13px 16px;display:flex;align-items:center;justify-content:space-between;gap:12px}
  .feature .claimrow .txt{font-size:13px;color:var(--muted);font-weight:700}
  .claim{padding:11px 18px;border-radius:13px;font-weight:800;font-size:14px;color:#fff;white-space:nowrap;
    background:linear-gradient(150deg,var(--lime),var(--green) 60%,var(--green-d));box-shadow:0 8px 18px -7px rgba(47,158,68,.55)}
  .claim.done{background:#ebfbee;color:var(--green-d);box-shadow:none;border:1px solid #b2f2bb}

  .foot{text-align:center;color:var(--muted);font-size:12px;margin-top:auto;padding-top:24px;line-height:1.5}

  /* ===== immersive reader ===== */
  .reader{position:fixed;inset:0;z-index:120;background:var(--bg);display:none;flex-direction:column;overflow:hidden}
  .reader.show{display:flex}
  .reader .rhero{position:relative;height:46%;min-height:250px;flex:none;overflow:hidden}
  .reader .rhero .illo{position:absolute;inset:0;width:100%;height:100%}
  .reader .rhero .rscrim{position:absolute;left:0;right:0;bottom:0;height:60%;background:linear-gradient(to top,var(--bg),transparent)}
  .rclose{position:absolute;top:calc(12px + env(safe-area-inset-top));right:14px;width:38px;height:38px;border-radius:50%;
    background:rgba(255,255,255,.92);box-shadow:var(--shadow);font-size:17px;display:grid;place-items:center;z-index:3}
  .rchip{position:absolute;top:calc(15px + env(safe-area-inset-top));left:16px;background:rgba(255,255,255,.92);
    color:var(--green-d);font-size:11px;font-weight:800;padding:6px 11px;border-radius:999px;z-index:3}
  .rcontent{flex:1;overflow-y:auto;padding:2px 24px 24px;margin-top:-34px;position:relative;z-index:2}
  .rcontent .kow{font-size:12px;font-weight:800;color:var(--green);text-transform:uppercase;letter-spacing:.5px}
  .rcontent h1{margin:6px 0 16px;font-family:"Fraunces",Georgia,serif;font-weight:700;font-size:30px;letter-spacing:-.5px;line-height:1.12}
  .rcontent p{font-size:17px;line-height:1.75;color:#37473c;font-weight:500;margin:0}
  .rreward{margin-top:20px;display:inline-block;background:#ebfbee;color:var(--green);border:1px solid #b2f2bb;
    padding:9px 16px;border-radius:999px;font-weight:800;font-size:13px}
  .rnav{flex:none;display:flex;align-items:center;justify-content:space-between;gap:12px;
    padding:12px 16px calc(14px + env(safe-area-inset-bottom));border-top:1px solid var(--line);background:#fff}
  .rnav button{padding:12px 18px;border-radius:13px;font-weight:800;font-size:14px;background:#f0ece2;color:var(--ink);transition:transform .12s}
  .rnav button:active{transform:scale(.95)}
  .rnav button.next{background:linear-gradient(150deg,var(--lime),var(--green) 60%,var(--green-d));color:#fff;box-shadow:0 8px 18px -7px rgba(47,158,68,.5)}
  .rnav button:disabled{opacity:.35}
  .dots{display:flex;gap:6px;align-items:center}
  .dots i{width:7px;height:7px;border-radius:50%;background:#cfd8cf;transition:.3s}
  .dots i.on{background:var(--green);width:20px;border-radius:4px}
  .rswap{animation:rswap .4s cubic-bezier(.2,.8,.2,1)}
  @keyframes rswap{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

  /* ===== illustration motion ===== */
  .illo .anim-sun,.illo .anim-spin,.illo .anim-bob,.illo .anim-steam,.illo .anim-bub,.illo .anim-sway,.illo .anim-pulse,.illo .anim-twinkle{transform-box:fill-box;transform-origin:center}
  .anim-sun{animation:aSun 4s ease-in-out infinite}
  @keyframes aSun{0%,100%{transform:scale(1);opacity:.95}50%{transform:scale(1.09);opacity:1}}
  .anim-spin{animation:aSpin 16s linear infinite}
  @keyframes aSpin{to{transform:rotate(360deg)}}
  .anim-bob{animation:aBob 3.4s ease-in-out infinite}
  @keyframes aBob{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
  .anim-steam{animation:aSteam 3s ease-in-out infinite}
  @keyframes aSteam{0%{transform:translateY(3px);opacity:0}30%{opacity:.85}100%{transform:translateY(-14px);opacity:0}}
  .anim-bub{animation:aBub 3s ease-in infinite}
  @keyframes aBub{0%{transform:translateY(8px);opacity:0}20%{opacity:1}100%{transform:translateY(-36px);opacity:0}}
  .anim-sway{animation:aSway 5s ease-in-out infinite;transform-origin:center top}
  @keyframes aSway{0%,100%{transform:rotate(-5deg)}50%{transform:rotate(5deg)}}
  .anim-pulse{animation:aPulse 2.4s ease-in-out infinite}
  @keyframes aPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.16)}}
  .anim-twinkle{animation:aTwinkle 2.6s ease-in-out infinite}
  @keyframes aTwinkle{0%,100%{opacity:.35;transform:scale(.8)}50%{opacity:1;transform:scale(1.1)}}
  @media (prefers-reduced-motion:reduce){.illo *{animation:none!important}}

  #fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:200}
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="title"><span class="ic">📖</span> Stories &amp; Tips</div>
    <div class="pts-chip">⭐ <b id="ptsTop">0</b></div>
  </header>

  <div class="collect">
    <div class="pbar"><i id="pbar"></i></div>
    <div class="ctxt" id="ctxt">0 / 0 read</div>
  </div>

  <div id="feature"></div>
  <div class="sec">Real-life stories</div>
  <div id="stories"></div>
  <div class="sec">Quick tips</div>
  <div id="tips"></div>

  <div class="foot">Fresh inspiration every day — come back tomorrow for a new tip. 🌞</div>
</div>

<!-- immersive reader -->
<div class="reader" id="reader">
  <div class="rhero" id="rhero"><div class="rscrim"></div></div>
  <span class="rchip" id="rchip"></span>
  <button class="rclose" id="rclose" aria-label="Close">✕</button>
  <div class="rcontent" id="rcontent"></div>
  <div class="rnav">
    <button id="rprev">‹ Back</button>
    <div class="dots" id="rdots"></div>
    <button class="next" id="rnext">Next ›</button>
  </div>
</div>

<canvas id="fx"></canvas>

<script src="../packs.js"></script>

  /* ---- shared points wallet (same origin as the main app) ---- */

    lastDay:null,goalsHit:0,owned:[],day:{date:today(),logs:[],points:0,counts:{}}};}
  function load(){try{var s=JSON.parse(localStorage.getItem(KEY));if(!s)return fresh();
    if(!s.day||s.day.date!==today())s.day={date:today(),logs:[],points:0,counts:{}};return s;}catch(e){return fresh();}}
  function award(pts,emoji,name){try{var S=load();S.points+=pts;S.day.points+=pts;
    S.day.logs.unshift({e:emoji,n:name,p:pts});localStorage.setItem(KEY,JSON.stringify(S));return S.points;}catch(e){return pts;}}

      '<svg class="illo" viewBox="0 0 400 176" preserveAspectRatio="xMidYMid slice">'+

      '<rect width="400" height="176" fill="url(#g_mk)"/>'+
      '<rect x="24" y="62" width="96" height="14" rx="4" fill="#b08968"/><rect x="24" y="106" width="96" height="14" rx="4" fill="#b08968"/>'+
      '<rect x="280" y="62" width="96" height="14" rx="4" fill="#b08968"/><rect x="280" y="106" width="96" height="14" rx="4" fill="#b08968"/>'+
      '<circle cx="44" cy="52" r="12" fill="#ff6b6b"/><circle cx="72" cy="52" r="12" fill="#ff8787"/><circle cx="100" cy="52" r="12" fill="#fa5252"/>'+
      '<circle cx="300" cy="52" r="12" fill="#ffa94d"/><circle cx="328" cy="52" r="12" fill="#ffc078"/><circle cx="356" cy="52" r="12" fill="#ff922b"/>'+
      '<path d="M40 98 q10 -18 20 0 q10 -18 20 0 q6 12 -10 12 h-20 q-16 0 -10 -12Z" fill="#51cf66"/>'+
      '<path d="M300 98 q10 -18 20 0 q10 -18 20 0 q6 12 -10 12 h-20 q-16 0 -10 -12Z" fill="#40c057"/>'+
      '<g class="anim-bob"><path d="M150 112 h100 l-12 44 h-76 Z" fill="#e8590c" opacity=".85"/><path d="M150 112 h100 l-3 12 h-94Z" fill="#ff922b"/>'+
      '<circle cx="176" cy="132" r="10" fill="#ff6b6b"/><circle cx="200" cy="132" r="10" fill="#ffd43b"/><circle cx="224" cy="132" r="10" fill="#51cf66"/>'+
      '<path d="M164 112 q36 -22 72 0" stroke="#c44d09" stroke-width="4" fill="none"/></g>'+
      '</svg>',
    slow:
      '<svg class="illo" viewBox="0 0 400 176" preserveAspectRatio="xMidYMid slice">'+
      '<defs><linearGradient id="g_sl" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e3fafc"/><stop offset="1" stop-color="#c5f6fa"/></linearGradient></defs>'+
      '<rect width="400" height="176" fill="url(#g_sl)"/>'+
      '<circle cx="200" cy="92" r="66" fill="#fff"/><circle cx="200" cy="92" r="66" fill="none" stroke="#e7e0d3" stroke-width="3"/>'+
      '<circle cx="200" cy="92" r="42" fill="#f1f3f5"/><circle cx="200" cy="92" r="42" fill="none" stroke="#adb5bd" stroke-width="3"/>'+
      '<path d="M200 92 L200 62" stroke="#495057" stroke-width="5" stroke-linecap="round"/><path d="M200 92 L222 102" stroke="#495057" stroke-width="5" stroke-linecap="round"/>'+
      '<circle cx="200" cy="92" r="5" fill="#495057"/>'+
      '<g stroke="#adb5bd" stroke-width="5" stroke-linecap="round"><path d="M96 58 v60"/><path d="M304 58 v60"/></g>'+
      '<path d="M300 58 v22 M316 58 v22" stroke="#adb5bd" stroke-width="5" stroke-linecap="round"/>'+
      '<path class="anim-pulse" d="M150 46 q8 -10 16 0 q8 -10 16 0 q0 12 -16 20 q-16 -8 -16 -20Z" fill="#ff8787"/>'+
      '</svg>'
  };

  var STORIES=[
    {id:"s1",illo:"lunchbox",cat:"Real-life story",h:"Ayesha's lunchbox",b:"Ayesha used to have a juice box every day at school and felt sleepy by the afternoon. Her mum swapped it for a bottle of water and a small box of grapes. Within a week Ayesha said she felt more awake in class — and she still got her sweet taste from the fruit."},
    {id:"s2",illo:"dates",cat:"Real-life story",h:"Grandma's dates",b:"After dinner, the family always reached for sweets. Grandma started putting out a bowl of dates and orange slices instead. Nobody missed the sweets — and everyone slept a little better."},
    {id:"s3",illo:"walk",cat:"Real-life story",h:"The after-dinner walk",b:"Omar's family began taking a short 15-minute walk together after dinner. It started as a way to help digestion, but it became the best part of their day — time to talk, with no screens."},
    {id:"s4",illo:"pot",cat:"Real-life story",h:"Cook once, eat twice",b:"Fatima started making a big pot of lentil stew on Sundays. With healthy food ready in the fridge, the family reached for takeaways far less during the busy week."}
  ];
  var TIPS=[
    {id:"t1",illo:"plate",cat:"Quick tip",h:"Fill half your plate",b:"At each meal, aim to make half your plate vegetables or fruit. It's the simplest way to eat better without counting anything — colour first, and the rest tends to fall into place."},
    {id:"t2",illo:"water",cat:"Quick tip",h:"Water before meals",b:"Drink a glass of water before you eat. It helps you stay hydrated and often stops you from over-eating, because thirst can feel a lot like hunger."},
    {id:"t3",illo:"label",cat:"Quick tip",h:"Check sugar on the label",b:"Look at 'sugars per 100g'. Around 5g or less is low (green), over 22.5g is high (red). Your scanner does this for you automatically — but it's a handy habit at the shelf too!"},
    {id:"t4",illo:"market",cat:"Quick tip",h:"Shop the edges",b:"Fresh foods — vegetables, fruit, dairy — usually line the outer walls of the shop. The processed snacks live in the middle aisles, so shopping the edges quietly stacks your basket with real food."},
    {id:"t5",illo:"slow",cat:"Quick tip",h:"Slow down",b:"It takes about 20 minutes for your body to feel full. Eating slowly gives it time to catch up, so you naturally eat less. Put the fork down between bites and let your body do the maths."}
  ];
  var PER=2, DAILY=5;

  // Personalise to the chosen community from the shared pack.
  try{
    var _p = window.RFR_pack && RFR_pack();
    if(_p){
      if(_p.stories && _p.stories.length){
        STORIES = _p.stories.map(function(s){ return {id:s.id, illo:s.illo, cat:"Real-life story", h:s.h, b:s.b}; });
      }
      if(_p.tips && _p.tips.length){
        TIPS = _p.tips.map(function(t){ return {id:t.id, illo:t.illo, cat:"Quick tip", h:t.h, b:t.b}; });
      }
      if(_p.accent){ document.documentElement.style.setProperty("--green",_p.accent);
        document.documentElement.style.setProperty("--green-d",_p.accent); }
    }
  }catch(e){}

  var ITEMS=STORIES.concat(TIPS);
  var indexOf={}; ITEMS.forEach(function(it,i){ indexOf[it.id]=i; });

  var seen=seenSet();
  setPts(totalPoints());

  function seenCount(){ var c=0; ITEMS.forEach(function(it){ if(seen[it.id]) c++; }); return c; }
  function updateProgress(){
    var c=seenCount(), t=ITEMS.length;
    document.getElementById("pbar").style.width=(c/t*100)+"%";
    document.getElementById("ctxt").textContent=c+" / "+t+" read";
  }

  /* ---- cover cards ---- */
  var cardEls={};
  function tagFor(id){ return seen[id] ? '✓ +'+PER : '+'+PER+' ⭐'; }
  function makeCover(item, cls){
    var el=document.createElement("button"); el.className="ic2"+(cls?" "+cls:"");
    el.innerHTML=
      '<div class="banner">'+ILLO[item.illo]+
        '<div class="scrim"></div>'+
        '<span class="chip">'+item.cat+'</span>'+
        '<span class="rtag'+(seen[item.id]?' done':'')+'" data-rt="'+item.id+'">'+tagFor(item.id)+'</span>'+
        '<div class="cap"><div class="kow">'+item.cat+'</div><h3>'+item.h+'</h3></div>'+
      '</div>'+
      '<div class="cue">▸ Tap to read'+(seen[item.id]?'':' &amp; earn +'+PER+' ⭐')+'</div>';
    el.onclick=function(){ openReader(indexOf[item.id]); };
    cardEls[item.id]=el;
    return el;
  }
  function refreshCover(id){
    var el=cardEls[id]; if(!el) return;
    var rt=el.querySelector('[data-rt="'+id+'"]');
    if(rt){ rt.textContent="✓ +"+PER; rt.className="rtag done"; }
    var cue=el.querySelector(".cue"); if(cue) cue.innerHTML="▸ Tap to read again";
  }

  /* ---- featured tip of the day ---- */
  function dayIndex(){ var d=new Date(); return (d.getFullYear()*372 + d.getMonth()*31 + d.getDate()); }
  var totd=ITEMS[dayIndex()%ITEMS.length];
  var DAY_KEY="rfr_tip_claimed";
  function claimedToday(){ try{return localStorage.getItem(DAY_KEY)===today();}catch(e){return false;} }
  (function renderFeature(){
    var claimed=claimedToday();
    var f=document.createElement("div"); f.className="ic2 feature";
    f.innerHTML=
      '<button class="banner" id="featOpen">'+ILLO[totd.illo]+'<div class="scrim"></div>'+
        '<span class="chip">☀️ Tip of the day</span>'+
        '<div class="cap"><div class="kow">Today’s inspiration</div><h3>'+totd.h+'</h3></div>'+
      '</button>'+
      '<div class="claimrow"><span class="txt">Read today’s tip to collect your bonus</span>'+
        '<button class="claim'+(claimed?' done':'')+'" id="claimBtn">'+(claimed?'✓ +'+DAILY+' claimed':'Claim +'+DAILY+' ⭐')+'</button></div>';
    document.getElementById("feature").appendChild(f);
    document.getElementById("featOpen").onclick=function(){ openReader(indexOf[totd.id]); };
    if(!claimed){
      document.getElementById("claimBtn").onclick=function(){
        try{localStorage.setItem(DAY_KEY,today());}catch(e){}
        var nt=award(DAILY,"📖","Tip of the day"); setPts(nt);
        var b=document.getElementById("claimBtn"); b.textContent="✓ +"+DAILY+" claimed"; b.className="claim done";
        confetti(70);
      };
    }
  })();

  var sh=document.getElementById("stories"); STORIES.forEach(function(s){ sh.appendChild(makeCover(s)); });
  var th=document.getElementById("tips"); TIPS.forEach(function(t){ th.appendChild(makeCover(t)); });
  updateProgress();

  /* ---- immersive reader ---- */
  var reader=document.getElementById("reader"), cur=-1;
  function renderReader(i){
    cur=i; var it=ITEMS[i];
    document.getElementById("rhero").innerHTML=ILLO[it.illo]+'<div class="rscrim"></div>';
    document.getElementById("rchip").textContent=it.cat;
    var justEarned=false;
    if(!seen[it.id]){ seen[it.id]=1; saveSeen(seen); var nt=award(PER,"📖",it.h); setPts(nt);
      refreshCover(it.id); updateProgress(); justEarned=true; confetti(30); }
    var c=document.getElementById("rcontent");
    c.classList.remove("rswap"); void c.offsetWidth; c.classList.add("rswap");
    c.innerHTML='<div class="kow">'+it.cat+'</div><h1>'+it.h+'</h1><p>'+it.b+'</p>'+
      '<div class="rreward">'+(justEarned?'+'+PER+' points earned ⭐':'✓ Read · +'+PER+' collected')+'</div>';
    // dots
    var dots=ITEMS.map(function(_,k){ return '<i class="'+(k===i?'on':'')+'"></i>'; }).join("");
    document.getElementById("rdots").innerHTML=dots;
    document.getElementById("rprev").disabled = i===0;
    var nextBtn=document.getElementById("rnext");
    nextBtn.textContent = i===ITEMS.length-1 ? "Done ✓" : "Next ›";
    document.getElementById("rcontent").scrollTop=0;
  }
  function openReader(i){ reader.classList.add("show"); renderReader(i); }
  function closeReader(){ reader.classList.remove("show"); }
  document.getElementById("rclose").onclick=closeReader;
  document.getElementById("rprev").onclick=function(){ if(cur>0) renderReader(cur-1); };
  document.getElementById("rnext").onclick=function(){ if(cur<ITEMS.length-1) renderReader(cur+1); else closeReader(); };
  // swipe
  var sx=0, sy=0;
  reader.addEventListener("touchstart",function(e){ sx=e.touches[0].clientX; sy=e.touches[0].clientY; },{passive:true});
  reader.addEventListener("touchend",function(e){
    var dx=e.changedTouches[0].clientX-sx, dy=e.changedTouches[0].clientY-sy;
    if(Math.abs(dx)>50 && Math.abs(dx)>Math.abs(dy)){
      if(dx<0 && cur<ITEMS.length-1) renderReader(cur+1);
      else if(dx>0 && cur>0) renderReader(cur-1);
    }
  },{passive:true});

  /* ---- confetti ---- */
  var fxC=document.getElementById("fx"), fxX=(fxC&&fxC.getContext)?fxC.getContext("2d"):null, Pt=[], raf=null;
  var COL=["#2f9e44","#82c91e","#f5b100","#e8590c","#4dabf7"];
  function rs(){ if(!fxX)return; fxC.width=window.innerWidth; fxC.height=window.innerHeight; }
  if(fxX){ rs(); window.addEventListener("resize",rs); }
  function confetti(n){ if(!fxX)return; for(var i=0;i<n;i++){Pt.push({x:window.innerWidth/2+(Math.random()*2-1)*80,
    y:window.innerHeight*0.3,vx:(Math.random()*2-1)*6,vy:-(5+Math.random()*7),g:0.24+Math.random()*0.12,
    s:5+Math.random()*5,c:COL[(i*7)%COL.length],r:Math.random()*6,vr:(Math.random()*2-1)*0.4,life:1});}
    if(!raf)raf=requestAnimationFrame(tick); }
  function tick(){ fxX.clearRect(0,0,fxC.width,fxC.height);
    for(var i=Pt.length-1;i>=0;i--){var p=Pt[i];p.vy+=p.g;p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;p.life-=0.009;
      if(p.y>fxC.height+24||p.life<=0){Pt.splice(i,1);continue;}
      fxX.save();fxX.globalAlpha=Math.max(0,p.life);fxX.translate(p.x,p.y);fxX.rotate(p.r);
      fxX.fillStyle=p.c;fxX.fillRect(-p.s/2,-p.s/2,p.s,p.s*0.62);fxX.restore();}
    if(Pt.length)raf=requestAnimationFrame(tick);else{raf=null;fxX.clearRect(0,0,fxC.width,fxC.height);} }
})();
</script>
</body>
</html>
