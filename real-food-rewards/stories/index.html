<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no" />
<meta name="theme-color" content="#f6f2ea" />
<title>Stories &amp; Tips · Real Food Rewards</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;0,9..144,700;1,9..144,500&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<style>
  :root{
    --bg:#f6f2ea; --card:#ffffff; --ink:#26332b; --muted:#6b7d70;
    --green:#2f9e44; --green-d:#2b8a3e; --gold:#e0a100; --line:#e7ded0;
    --shadow:0 16px 34px -18px rgba(70,52,28,.30);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%}
  body{background:radial-gradient(120% 90% at 50% -8%, #fbf5e7 0%, #f4ecdc 55%, #efe5d3 100%) fixed;color:var(--ink);
    font-family:"Manrope",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
  #app{max-width:520px;margin:0 auto;min-height:100%;padding:0 18px calc(30px + env(safe-area-inset-bottom));display:flex;flex-direction:column}
  header{padding:calc(18px + env(safe-area-inset-top)) 2px 6px;display:flex;align-items:center;justify-content:space-between}
  .title{display:flex;align-items:center;gap:10px;font-family:"Fraunces",Georgia,serif;font-weight:700;font-size:21px;letter-spacing:-.3px}
  .title .ic{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;font-size:20px;background:linear-gradient(150deg,#ffe8cc,#ffd8a8)}
  .pts-chip{display:flex;align-items:center;gap:6px;background:#fff;border:1px solid var(--line);padding:8px 12px;border-radius:999px;font-weight:800;font-size:14px;box-shadow:var(--shadow)}
  .pts-chip b{color:var(--green)}
  button{font-family:inherit;cursor:pointer;border:none;color:inherit;background:none;text-align:left}

  .collect{margin:8px 2px 2px;display:flex;align-items:center;gap:12px}
  .collect .pbar{flex:1;height:9px;border-radius:999px;background:#ece1cf;overflow:hidden}
  .collect .pbar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#9cd67a,var(--green));border-radius:999px;transition:width .5s}
  .collect .ctxt{font-size:12px;font-weight:800;color:var(--muted);white-space:nowrap}
  .sec{font-family:"Fraunces",Georgia,serif;font-weight:600;color:var(--ink);font-size:17px;margin:20px 2px 12px}

  .cover{position:relative;height:158px;overflow:hidden;border-radius:0}
  .cover .cimg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:0}
  .cover .cscrim{position:absolute;inset:0;z-index:1;background:linear-gradient(to top,rgba(0,0,0,.42),rgba(0,0,0,.05) 60%)}
  .cover .stamp{position:absolute;right:14px;bottom:12px;width:52px;height:52px;border-radius:16px;background:rgba(255,255,255,.9);display:grid;place-items:center;font-size:27px;box-shadow:0 8px 18px rgba(0,0,0,.16);z-index:2}
  .cover .ptag{position:absolute;left:14px;bottom:14px;z-index:2;color:#fff;font-family:"Fraunces",Georgia,serif;font-weight:600;font-size:20px;letter-spacing:-.2px;line-height:1.15;text-shadow:0 2px 10px rgba(0,0,0,.4);max-width:74%}
  .cover .kind{position:absolute;left:14px;top:13px;z-index:2;background:rgba(255,255,255,.9);color:var(--green-d);font-size:11px;font-weight:800;padding:5px 10px;border-radius:999px}

  .scard{background:#fff;border:1px solid var(--line);border-radius:22px;box-shadow:var(--shadow);overflow:hidden;margin-bottom:16px;width:100%;transition:transform .15s;display:block}
  .scard:active{transform:scale(.99)}
  .scard .body{padding:15px 18px 15px}
  .scard .dek{font-size:14.5px;line-height:1.5;color:#46564b;font-weight:600;margin:0}
  .scard .cue{margin-top:12px;display:flex;align-items:center;justify-content:space-between;gap:10px}
  .scard .cue .go{font-size:13px;font-weight:800;color:var(--green-d)}
  .rew{background:#eafaef;color:var(--green-d);border:1px solid #cdeacc;padding:5px 11px;border-radius:999px;font-weight:800;font-size:11.5px;white-space:nowrap}
  .rew.done{background:#eef7ee}

  .feature .cover{height:190px}
  .feature .fbody{padding:15px 18px}
  .feature .claimrow{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:12px}
  .feature .txt{font-size:12.5px;color:var(--muted);font-weight:700}
  .claim{padding:11px 17px;border-radius:13px;font-weight:800;font-size:14px;color:#fff;white-space:nowrap;background:linear-gradient(150deg,#8fd06a,var(--green) 60%,var(--green-d));box-shadow:0 8px 18px -7px rgba(47,158,68,.5)}
  .claim.done{background:#eef7ee;color:var(--green-d);box-shadow:none;border:1px solid #cdeacc}
  .foot{text-align:center;color:var(--muted);font-size:12px;margin-top:auto;padding-top:24px;line-height:1.5}

  /* reader */
  .reader{position:fixed;inset:0;z-index:120;background:var(--bg);display:none;flex-direction:column;overflow:hidden}
  .reader.show{display:flex}
  .reader .rcover{position:relative;height:34%;min-height:200px;flex:none;overflow:hidden}
  .reader .rcover .cimg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:0}
  .reader .rcover .cscrim{position:absolute;inset:0;z-index:1;background:linear-gradient(to top,var(--bg) 2%,rgba(0,0,0,.18) 45%,rgba(0,0,0,.30))}
  .reader .rcover .stamp{position:absolute;right:16px;bottom:26px;width:56px;height:56px;border-radius:17px;background:rgba(255,255,255,.92);display:grid;place-items:center;font-size:29px;box-shadow:0 10px 22px rgba(0,0,0,.18);z-index:2}
  .rclose{position:absolute;top:calc(12px + env(safe-area-inset-top));right:14px;width:38px;height:38px;border-radius:50%;background:rgba(255,255,255,.92);box-shadow:var(--shadow);font-size:17px;display:grid;place-items:center;z-index:4}
  .rkind{position:absolute;top:calc(15px + env(safe-area-inset-top));left:16px;background:rgba(255,255,255,.9);color:var(--green-d);font-size:11px;font-weight:800;padding:6px 11px;border-radius:999px;z-index:4}
  .rcontent{flex:1;overflow-y:auto;padding:2px 24px 26px;position:relative;z-index:2}
  .rcontent .rtitle{font-family:"Fraunces",Georgia,serif;font-weight:700;font-size:29px;line-height:1.12;letter-spacing:-.5px;margin:2px 0 0}
  .rcontent .rby{margin-top:8px;font-size:13px;font-weight:800;color:var(--green-d);text-transform:uppercase;letter-spacing:.4px}
  .rcontent .rtext{margin-top:16px;font-size:17px;line-height:1.75;color:#3a4a40;font-weight:500}
  .rcontent .rtext p{margin:0 0 15px}
  .rcontent .pull{margin:20px 0;padding:2px 0 2px 18px;border-left:4px solid var(--green);
    font-family:"Fraunces",Georgia,serif;font-style:italic;font-weight:500;font-size:21px;line-height:1.35;color:var(--ink)}
  .rreward{margin-top:6px;display:inline-block;background:#eafaef;color:var(--green-d);border:1px solid #cdeacc;padding:9px 16px;border-radius:999px;font-weight:800;font-size:13px}
  .rswap{animation:rswap .4s cubic-bezier(.2,.8,.2,1)}
  @keyframes rswap{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
  .rnav{flex:none;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 16px calc(14px + env(safe-area-inset-bottom));border-top:1px solid var(--line);background:#fff}
  .rnav button{padding:12px 18px;border-radius:13px;font-weight:800;font-size:14px;background:#f4ede1;color:var(--ink);transition:transform .12s}
  .rnav button:active{transform:scale(.95)}
  .rnav button.next{background:linear-gradient(150deg,#8fd06a,var(--green) 60%,var(--green-d));color:#fff;box-shadow:0 8px 18px -7px rgba(47,158,68,.5)}
  .rnav button:disabled{opacity:.35}
  .dots{display:flex;gap:6px;align-items:center}
  .dots i{width:7px;height:7px;border-radius:50%;background:#d8cdb8;transition:.3s}
  .dots i.on{background:var(--green);width:20px;border-radius:4px}
  #fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:200}
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="title"><span class="ic">📖</span> Stories &amp; Tips</div>
    <div class="pts-chip">⭐ <b id="ptsTop">0</b></div>
  </header>
  <div class="collect"><div class="pbar"><i id="pbar"></i></div><div class="ctxt" id="ctxt">0 / 0 read</div></div>

  <div id="feature"></div>
  <div class="sec">Stories</div>
  <div id="stories"></div>
  <div class="sec">Little tips</div>
  <div id="tips"></div>
  <div class="foot">Warm stories from home. A new one to find each day. 🌱</div>
</div>

<div class="reader" id="reader">
  <div class="rcover" id="rcover"></div>
  <span class="rkind" id="rkind"></span>
  <button class="rclose" id="rclose" aria-label="Close">✕</button>
  <div class="rcontent" id="rcontent"></div>
  <div class="rnav"><button id="rprev">‹ Back</button><div class="dots" id="rdots"></div><button class="next" id="rnext">Next ›</button></div>
</div>
<canvas id="fx"></canvas>

<script src="../packs.js"></script>
<script>
(function(){
  "use strict";
  var KEY="rfr_state_v1";
  function today(){var d=new Date();return d.getFullYear()+"-"+(d.getMonth()+1)+"-"+d.getDate();}
  function fresh(){return {points:0,totalLogs:0,vegLogs:0,waterLogs:0,bestStreak:0,streak:0,lastDay:null,goalsHit:0,owned:[],day:{date:today(),logs:[],points:0,counts:{}}};}
  function load(){try{var s=JSON.parse(localStorage.getItem(KEY));if(!s)return fresh();if(!s.day||s.day.date!==today())s.day={date:today(),logs:[],points:0,counts:{}};return s;}catch(e){return fresh();}}
  function award(pts,emoji,name){try{var S=load();S.points+=pts;S.day.points+=pts;S.day.logs.unshift({e:emoji,n:name,p:pts});localStorage.setItem(KEY,JSON.stringify(S));return S.points;}catch(e){return pts;}}
  function totalPoints(){return load().points;}
  function setPts(v){document.getElementById("ptsTop").textContent=v;}
  var SEEN_KEY="rfr_stories_seen";
  function seenSet(){try{return JSON.parse(localStorage.getItem(SEEN_KEY))||{};}catch(e){return {};}}
  function saveSeen(o){try{localStorage.setItem(SEEN_KEY,JSON.stringify(o));}catch(e){}}

  var HUES={peach:["#ffdcb0","#ef8f52"],rose:["#ffcdd6","#e98aa0"],green:["#bfe7b8","#5cab6a"],amber:["#ffe2a0","#e0a53c"],blue:["#c6e2ff","#7aa9e0"]};
  function hueCss(h){var c=HUES[h]||HUES.green;return "linear-gradient(150deg,"+c[0]+","+c[1]+")";}

  /* ---- default (English) content ---- actual stories, multi-paragraph ---- */
  var STORIES=[
    {id:"s1",motif:"🍇",hue:"amber",photo:"https://loremflickr.com/640/400/grapes,fruit?lock=101",
     h:"Ayesha's afternoons", by:"A story from the community",
     dek:"A juice box, a sleepy classroom, and one small change.",
     b:["Every morning, Ayesha's mother tucked a juice box into her school bag. It was the easy thing, the sweet thing, and Ayesha loved it. But by the middle of each afternoon her head would grow heavy, and the words on the board began to swim.",
        "Her teacher mentioned it kindly at pick-up one day. That evening, Ayesha's mother stood at the counter, thinking, and remembered the little boxes of grapes her own mother used to pack, cold and sweet from the fridge.",
        "The next morning, in went a bottle of water and a small box of grapes. Ayesha was unsure at first. But the grapes were sweet, the water was cold, and something about the afternoon felt clearer.",
        "A week later her teacher smiled and said Ayesha seemed brighter. She still gets her sweet taste, her mother thought. It just comes from the fruit now."],
     pull:"She still gets her sweet taste. It just comes from the fruit now."},
    {id:"s2",motif:"🌇",hue:"rose",photo:"https://loremflickr.com/640/400/park,sunset?lock=102",
     h:"Fifteen minutes", by:"A story from the community",
     dek:"He was too tired to move after dinner. Then came a small idea.",
     b:["By the time dinner was finished, Daniel wanted only to sink into the sofa and not move until morning. The day sat heavy on him, and the meal sat heavy too.",
        "His wife watched him one evening and said simply, 'Come. Just to the end of the street and back.' He grumbled, but he went. The children, hearing there was a walk, came running.",
        "The air was cool. They passed the shop closing up and the neighbour watering her plants. The children raced ahead and circled back, breathless and laughing, and Daniel felt his chest open, just a little.",
        "They walk most evenings now, the whole family, fifteen minutes into the dusk. He sleeps deeper for it. But that is not why they go. They go because it has become the part of the day that belongs to them."],
     pull:"It has become the part of the day that belongs to them."},
    {id:"s3",motif:"🍲",hue:"green",photo:"https://loremflickr.com/640/400/stew,pot?lock=103",
     h:"The Sunday pot", by:"A story from the community",
     dek:"One big pot on the weekend, and the whole week changed.",
     b:["The week had a way of getting away from Priya. Between the children, the errands and the long days, dinner often arrived as whatever was fastest: a call to the takeaway, a bag of something fried.",
        "One Sunday, with the kitchen quiet and the morning open, she set a great pot on the stove and cooked a stew the way her mother taught her, thick with beans and vegetables and slow, patient time.",
        "It filled the house with a smell that drew the children in one by one. There was enough for Sunday, and plenty left besides. On Monday, tired and late, she opened the fridge and there it was, waiting.",
        "That one pot carried them halfway through the week. The takeaways grew rare. 'One big pot on the weekend,' she says, 'and somehow the whole week feels easier.'"],
     pull:"One big pot on the weekend, and the whole week feels easier."}
  ];
  var TIPS=[
    {id:"t1",motif:"🥗",hue:"green",photo:"https://loremflickr.com/640/400/salad,vegetables?lock=111",h:"Fill half your plate",b:"At each meal, aim to make half your plate vegetables or fruit. Colour first, and the rest tends to fall into place."},
    {id:"t2",motif:"💧",hue:"blue",photo:"https://loremflickr.com/640/400/water,glass?lock=112",h:"Water before meals",b:"Have a glass of water before you eat. It keeps you hydrated, and thirst can feel a lot like hunger."},
    {id:"t3",motif:"🏷️",hue:"amber",photo:"https://loremflickr.com/640/400/groceries,shopping?lock=113",h:"Check the label",b:"Look at sugars per 100g. Around 5g is low, over 22.5g is high. Your scanner does this for you, and it is a handy habit at the shelf too."}
  ];
  var PER=2, DAILY=5;

  try{
    var _p = window.RFR_pack && RFR_pack();
    if(_p){
      if(_p.stories && _p.stories.length) STORIES=_p.stories;
      if(_p.tips && _p.tips.length) TIPS=_p.tips;
      if(_p.accent){ document.documentElement.style.setProperty("--green",_p.accent); }
    }
  }catch(e){}

  STORIES.forEach(function(s){ s._type="story"; s.hue=s.hue||"green"; s.motif=s.motif||"📖"; });
  TIPS.forEach(function(t){ t._type="tip"; t.hue=t.hue||"amber"; t.motif=t.motif||"💡"; });
  var ITEMS=STORIES.concat(TIPS);
  var indexOf={}; ITEMS.forEach(function(it,i){ indexOf[it.id]=i; });

  var seen=seenSet();
  setPts(totalPoints());
  function seenCount(){ var c=0; ITEMS.forEach(function(it){ if(seen[it.id]) c++; }); return c; }
  function updateProgress(){ var c=seenCount(),t=ITEMS.length; document.getElementById("pbar").style.width=(c/t*100)+"%"; document.getElementById("ctxt").textContent=c+" / "+t+" read"; }
  function bodyText(it){ return Array.isArray(it.b) ? it.b : [it.b]; }
  function dekOf(it){ return it.dek || (Array.isArray(it.b)? it.b[0] : it.b); }

  function coverEl(it, extra){
    var img = it.photo ? '<img class="cimg" src="'+it.photo+'" alt="" loading="lazy" onerror="this.remove()">' : '';
    var scrim = it.photo ? '<span class="cscrim"></span>' : '';
    return '<div class="cover" style="background:'+hueCss(it.hue)+'">'+img+scrim+
      (extra||'')+
      '<span class="ptag">'+it.h+'</span><span class="stamp">'+it.motif+'</span></div>';
  }

  var cardEls={};
  function makeCard(it){
    var el=document.createElement("button"); el.className="scard";
    el.innerHTML=coverEl(it)+
      '<div class="body"><p class="dek">'+dekOf(it)+'</p>'+
      '<div class="cue"><span class="go">'+(it._type==="story"?"Read the story ›":"Read tip ›")+'</span>'+
      '<span class="rew'+(seen[it.id]?' done':'')+'" data-rt="'+it.id+'">'+(seen[it.id]?'✓ +'+PER:'+'+PER+' ⭐')+'</span></div></div>';
    el.onclick=function(){ openReader(indexOf[it.id]); };
    cardEls[it.id]=el; return el;
  }
  function refreshCard(id){ var el=cardEls[id]; if(!el)return; var rt=el.querySelector('[data-rt="'+id+'"]'); if(rt){ rt.textContent="✓ +"+PER; rt.className="rew done"; } }

  /* featured story of the day */
  function dayIndex(){ var d=new Date(); return (d.getFullYear()*372 + d.getMonth()*31 + d.getDate()); }
  var pool=STORIES.length?STORIES:ITEMS;
  var totd=pool[dayIndex()%pool.length];
  var DAY_KEY="rfr_tip_claimed";
  function claimedToday(){ try{return localStorage.getItem(DAY_KEY)===today();}catch(e){return false;} }
  (function(){
    var claimed=claimedToday();
    var f=document.createElement("div"); f.className="scard feature";
    f.innerHTML=coverEl(totd,'<span class="kind">☀️ Story of the day</span>')+
      '<div class="fbody"><p class="dek">'+dekOf(totd)+'</p>'+
      '<div class="claimrow"><span class="txt">Read today’s story to collect your bonus</span>'+
      '<button class="claim'+(claimed?' done':'')+'" id="claimBtn">'+(claimed?'✓ +'+DAILY+' claimed':'Claim +'+DAILY+' ⭐')+'</button></div></div>';
    document.getElementById("feature").appendChild(f);
    f.querySelector(".cover").onclick=function(){ openReader(indexOf[totd.id]); };
    if(!claimed){ document.getElementById("claimBtn").onclick=function(ev){ ev.stopPropagation();
      try{localStorage.setItem(DAY_KEY,today());}catch(e){}
      var nt=award(DAILY,"📖","Story of the day"); setPts(nt);
      var b=document.getElementById("claimBtn"); b.textContent="✓ +"+DAILY+" claimed"; b.className="claim done"; confetti(70); }; }
  })();

  var sh=document.getElementById("stories"); STORIES.forEach(function(s){ sh.appendChild(makeCard(s)); });
  var th=document.getElementById("tips"); TIPS.forEach(function(t){ th.appendChild(makeCard(t)); });
  updateProgress();

  /* reader */
  var reader=document.getElementById("reader"), cur=-1;
  function renderReader(i){
    cur=i; var it=ITEMS[i];
    var img = it.photo ? '<img class="cimg" src="'+it.photo+'" alt="" loading="lazy" onerror="this.remove()">' : '';
    document.getElementById("rcover").style.cssText="background:"+hueCss(it.hue);
    document.getElementById("rcover").innerHTML=img+'<span class="cscrim"></span><span class="stamp">'+it.motif+'</span>';
    document.getElementById("rkind").textContent = it._type==="story" ? "Story" : "Little tip";
    var earned=false;
    if(!seen[it.id]){ seen[it.id]=1; saveSeen(seen); var nt=award(PER,"📖",it.h); setPts(nt); refreshCard(it.id); updateProgress(); earned=true; confetti(28); }
    var paras=bodyText(it), html='<h1 class="rtitle">'+it.h+'</h1>'+(it.by?'<div class="rby">'+it.by+'</div>':'')+'<div class="rtext">';
    paras.forEach(function(p,idx){ html+='<p>'+p+'</p>'; if(it.pull && idx===0 && paras.length>1){ html+='<blockquote class="pull">“'+it.pull+'”</blockquote>'; } });
    html+='</div><div class="rreward">'+(earned?'+'+PER+' points earned ⭐':'✓ Read · +'+PER+' collected')+'</div>';
    var c=document.getElementById("rcontent"); c.classList.remove("rswap"); void c.offsetWidth; c.classList.add("rswap"); c.innerHTML=html;
    document.getElementById("rdots").innerHTML=ITEMS.map(function(_,k){return '<i class="'+(k===i?'on':'')+'"></i>';}).join("");
    document.getElementById("rprev").disabled=i===0;
    document.getElementById("rnext").textContent=i===ITEMS.length-1?"Done ✓":"Next ›";
    c.scrollTop=0;
  }
  function openReader(i){ reader.classList.add("show"); renderReader(i); }
  function closeReader(){ reader.classList.remove("show"); }
  document.getElementById("rclose").onclick=closeReader;
  document.getElementById("rprev").onclick=function(){ if(cur>0) renderReader(cur-1); };
  document.getElementById("rnext").onclick=function(){ if(cur<ITEMS.length-1) renderReader(cur+1); else closeReader(); };
  var sx=0,sy=0;
  reader.addEventListener("touchstart",function(e){sx=e.touches[0].clientX;sy=e.touches[0].clientY;},{passive:true});
  reader.addEventListener("touchend",function(e){var dx=e.changedTouches[0].clientX-sx,dy=e.changedTouches[0].clientY-sy;
    if(Math.abs(dx)>50&&Math.abs(dx)>Math.abs(dy)){ if(dx<0&&cur<ITEMS.length-1)renderReader(cur+1); else if(dx>0&&cur>0)renderReader(cur-1); }},{passive:true});

  /* confetti */
  var fxC=document.getElementById("fx"), fxX=(fxC&&fxC.getContext)?fxC.getContext("2d"):null, Pt=[], raf=null;
  var COL=["#2f9e44","#8fd06a","#e0a100","#e8590c","#4dabf7"];
  function rs(){ if(!fxX)return; fxC.width=window.innerWidth; fxC.height=window.innerHeight; }
  if(fxX){ rs(); window.addEventListener("resize",rs); }
  function confetti(n){ if(!fxX)return; for(var i=0;i<n;i++){Pt.push({x:window.innerWidth/2+(Math.random()*2-1)*80,y:window.innerHeight*0.3,vx:(Math.random()*2-1)*6,vy:-(5+Math.random()*7),g:0.24+Math.random()*0.12,s:5+Math.random()*5,c:COL[(i*7)%COL.length],r:Math.random()*6,vr:(Math.random()*2-1)*0.4,life:1});}
    if(!raf)raf=requestAnimationFrame(tick); }
  function tick(){ fxX.clearRect(0,0,fxC.width,fxC.height);
    for(var i=Pt.length-1;i>=0;i--){var p=Pt[i];p.vy+=p.g;p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;p.life-=0.009;
      if(p.y>fxC.height+24||p.life<=0){Pt.splice(i,1);continue;}
      fxX.save();fxX.globalAlpha=Math.max(0,p.life);fxX.translate(p.x,p.y);fxX.rotate(p.r);fxX.fillStyle=p.c;fxX.fillRect(-p.s/2,-p.s/2,p.s,p.s*0.62);fxX.restore();}
    if(Pt.length)raf=requestAnimationFrame(tick);else{raf=null;fxX.clearRect(0,0,fxC.width,fxC.height);} }
})();
</script>
