<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no" />
<meta name="theme-color" content="#f6f2ea" />
<title>Stories &amp; Tips · Real Food Rewards</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;0,9..144,700;1,9..144,500&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<style>
  :root{
    --bg:#f6f2ea; --card:#ffffff; --ink:#26332b; --muted:#6b7d70;
    --green:#2f9e44; --green-d:#2b8a3e; --gold:#e0a100; --line:#e7ded0;
    --shadow:0 16px 34px -18px rgba(70,52,28,.30);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%}
  body{background:radial-gradient(120% 90% at 50% -8%, #fbf5e7 0%, #f4ecdc 55%, #efe5d3 100%) fixed;color:var(--ink);
    font-family:"Manrope",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
  #app{max-width:520px;margin:0 auto;min-height:100%;padding:0 18px calc(30px + env(safe-area-inset-bottom));display:flex;flex-direction:column}
  header{padding:calc(18px + env(safe-area-inset-top)) 2px 6px;display:flex;align-items:center;justify-content:space-between}
  .title{display:flex;align-items:center;gap:10px;font-family:"Fraunces",Georgia,serif;font-weight:700;font-size:21px;letter-spacing:-.3px}
  .title .ic{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;font-size:20px;background:linear-gradient(150deg,#ffe8cc,#ffd8a8)}
  .pts-chip{display:flex;align-items:center;gap:6px;background:#fff;border:1px solid var(--line);padding:8px 12px;border-radius:999px;font-weight:800;font-size:14px;box-shadow:var(--shadow)}
  .pts-chip b{color:var(--green)}
  button{font-family:inherit;cursor:pointer;border:none;color:inherit;background:none;text-align:left}

  .collect{margin:8px 2px 2px;display:flex;align-items:center;gap:12px}
  .collect .pbar{flex:1;height:9px;border-radius:999px;background:#ece1cf;overflow:hidden}
  .collect .pbar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#9cd67a,var(--green));border-radius:999px;transition:width .5s}
  .collect .ctxt{font-size:12px;font-weight:800;color:var(--muted);white-space:nowrap}
  .sec{font-family:"Fraunces",Georgia,serif;font-weight:600;color:var(--ink);font-size:17px;margin:20px 2px 12px}

  /* cover (photo-ready). No photo -> warm textured block with a serif quote mark + motif stamp */
  .cover{position:relative;height:150px;overflow:hidden;background-size:cover;background-position:center}
  .cover .qmark{position:absolute;top:-26px;left:8px;font-family:"Fraunces",Georgia,serif;font-size:150px;line-height:1;color:rgba(255,255,255,.5)}
  .cover .stamp{position:absolute;right:14px;bottom:12px;width:52px;height:52px;border-radius:16px;background:rgba(255,255,255,.85);
    display:grid;place-items:center;font-size:27px;box-shadow:0 8px 18px rgba(0,0,0,.14)}
  .cover .ph-note{position:absolute;left:12px;bottom:10px;font-size:10px;font-weight:800;letter-spacing:.4px;text-transform:uppercase;color:rgba(255,255,255,.85)}

  .scard{background:#fff;border:1px solid var(--line);border-radius:22px;box-shadow:var(--shadow);overflow:hidden;margin-bottom:16px;width:100%;transition:transform .15s}
  .scard:active{transform:scale(.99)}
  .scard .body{padding:16px 18px 15px}
  .scard .quote{font-family:"Fraunces",Georgia,serif;font-weight:600;font-size:19px;line-height:1.32;letter-spacing:-.2px;margin:0}
  .scard .by{margin-top:10px;font-size:13px;font-weight:800;color:var(--green-d)}
  .scard .th{font-family:"Fraunces",Georgia,serif;font-weight:600;font-size:19px;margin:0 0 5px;letter-spacing:-.2px}
  .scard .tl{margin:0;font-size:14px;line-height:1.55;color:#4a5b50;font-weight:500}
  .scard .cue{margin-top:12px;display:flex;align-items:center;justify-content:space-between;gap:10px}
  .scard .cue .go{font-size:13px;font-weight:800;color:var(--muted)}
  .rew{background:#eafaef;color:var(--green-d);border:1px solid #cdeacc;padding:5px 11px;border-radius:999px;font-weight:800;font-size:11.5px;white-space:nowrap}
  .rew.done{background:#eef7ee}

  /* featured */
  .feature{margin-bottom:6px}
  .feature .cover{height:196px}
  .feature .kick{position:absolute;top:12px;left:12px;background:rgba(255,255,255,.9);color:var(--green-d);font-size:11px;font-weight:800;padding:6px 11px;border-radius:999px}
  .feature .fbody{padding:16px 18px}
  .feature .claimrow{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:12px}
  .feature .txt{font-size:12.5px;color:var(--muted);font-weight:700}
  .claim{padding:11px 17px;border-radius:13px;font-weight:800;font-size:14px;color:#fff;white-space:nowrap;background:linear-gradient(150deg,#8fd06a,var(--green) 60%,var(--green-d));box-shadow:0 8px 18px -7px rgba(47,158,68,.5)}
  .claim.done{background:#eef7ee;color:var(--green-d);box-shadow:none;border:1px solid #cdeacc}

  .foot{text-align:center;color:var(--muted);font-size:12px;margin-top:auto;padding-top:24px;line-height:1.5}

  /* reader */
  .reader{position:fixed;inset:0;z-index:120;background:var(--bg);display:none;flex-direction:column;overflow:hidden}
  .reader.show{display:flex}
  .reader .rcover{position:relative;height:38%;min-height:220px;flex:none;overflow:hidden;background-size:cover;background-position:center}
  .reader .rcover .qmark{position:absolute;top:-34px;left:12px;font-family:"Fraunces",Georgia,serif;font-size:200px;line-height:1;color:rgba(255,255,255,.5)}
  .reader .rcover .stamp{position:absolute;right:16px;bottom:16px;width:60px;height:60px;border-radius:18px;background:rgba(255,255,255,.9);display:grid;place-items:center;font-size:31px;box-shadow:0 10px 22px rgba(0,0,0,.16)}
  .reader .rcover .rscrim{position:absolute;left:0;right:0;bottom:0;height:46%;background:linear-gradient(to top,var(--bg),transparent)}
  .rclose{position:absolute;top:calc(12px + env(safe-area-inset-top));right:14px;width:38px;height:38px;border-radius:50%;background:rgba(255,255,255,.92);box-shadow:var(--shadow);font-size:17px;display:grid;place-items:center;z-index:3}
  .rchip{position:absolute;top:calc(15px + env(safe-area-inset-top));left:16px;background:rgba(255,255,255,.9);color:var(--green-d);font-size:11px;font-weight:800;padding:6px 11px;border-radius:999px;z-index:3}
  .rcontent{flex:1;overflow-y:auto;padding:4px 24px 24px;position:relative;z-index:2}
  .rcontent .rquote{font-family:"Fraunces",Georgia,serif;font-weight:600;font-size:26px;line-height:1.28;letter-spacing:-.4px;margin:6px 0 0}
  .rcontent .rby{margin-top:12px;font-size:14px;font-weight:800;color:var(--green-d)}
  .rcontent .rbody{margin-top:16px;font-size:16.5px;line-height:1.75;color:#3f4f45;font-weight:500}
  .rcontent .rbody p{margin:0 0 14px}
  .rreward{margin-top:8px;display:inline-block;background:#eafaef;color:var(--green-d);border:1px solid #cdeacc;padding:9px 16px;border-radius:999px;font-weight:800;font-size:13px}
  .rswap{animation:rswap .4s cubic-bezier(.2,.8,.2,1)}
  @keyframes rswap{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
  .rnav{flex:none;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 16px calc(14px + env(safe-area-inset-bottom));border-top:1px solid var(--line);background:#fff}
  .rnav button{padding:12px 18px;border-radius:13px;font-weight:800;font-size:14px;background:#f4ede1;color:var(--ink);transition:transform .12s}
  .rnav button:active{transform:scale(.95)}
  .rnav button.next{background:linear-gradient(150deg,#8fd06a,var(--green) 60%,var(--green-d));color:#fff;box-shadow:0 8px 18px -7px rgba(47,158,68,.5)}
  .rnav button:disabled{opacity:.35}
  .dots{display:flex;gap:6px;align-items:center}
  .dots i{width:7px;height:7px;border-radius:50%;background:#d8cdb8;transition:.3s}
  .dots i.on{background:var(--green);width:20px;border-radius:4px}

  #fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:200}
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="title"><span class="ic">📖</span> Stories &amp; Tips</div>
    <div class="pts-chip">⭐ <b id="ptsTop">0</b></div>
  </header>
  <div class="collect"><div class="pbar"><i id="pbar"></i></div><div class="ctxt" id="ctxt">0 / 0 read</div></div>

  <div id="feature"></div>
  <div class="sec">In their words</div>
  <div id="stories"></div>
  <div class="sec">Little tips</div>
  <div id="tips"></div>
  <div class="foot">Real voices from the community. Come back tomorrow for a new one. 🌱</div>
</div>

<div class="reader" id="reader">
  <div class="rcover" id="rcover"></div>
  <span class="rchip" id="rchip"></span>
  <button class="rclose" id="rclose" aria-label="Close">✕</button>
  <div class="rcontent" id="rcontent"></div>
  <div class="rnav"><button id="rprev">‹ Back</button><div class="dots" id="rdots"></div><button class="next" id="rnext">Next ›</button></div>
</div>
<canvas id="fx"></canvas>

<script src="../packs.js"></script>
<script>
(function(){
  "use strict";

  var KEY="rfr_state_v1";
  function today(){var d=new Date();return d.getFullYear()+"-"+(d.getMonth()+1)+"-"+d.getDate();}
  function fresh(){return {points:0,totalLogs:0,vegLogs:0,waterLogs:0,bestStreak:0,streak:0,lastDay:null,goalsHit:0,owned:[],day:{date:today(),logs:[],points:0,counts:{}}};}
  function load(){try{var s=JSON.parse(localStorage.getItem(KEY));if(!s)return fresh();if(!s.day||s.day.date!==today())s.day={date:today(),logs:[],points:0,counts:{}};return s;}catch(e){return fresh();}}
  function award(pts,emoji,name){try{var S=load();S.points+=pts;S.day.points+=pts;S.day.logs.unshift({e:emoji,n:name,p:pts});localStorage.setItem(KEY,JSON.stringify(S));return S.points;}catch(e){return pts;}}
  function totalPoints(){return load().points;}
  function setPts(v){document.getElementById("ptsTop").textContent=v;}
  var SEEN_KEY="rfr_stories_seen";
  function seenSet(){try{return JSON.parse(localStorage.getItem(SEEN_KEY))||{};}catch(e){return {};}}
  function saveSeen(o){try{localStorage.setItem(SEEN_KEY,JSON.stringify(o));}catch(e){}}

  /* warm cover palettes (no illustrations; photo-ready) */
  var HUES={
    peach:["#ffdcb0","#ff9e6b"], rose:["#ffd0d8","#f492a6"], green:["#c7ecc0","#7cc27a"],
    amber:["#ffe6a6","#f0b24a"], blue:["#cfe6ff","#8bb9ee"], plum:["#e6d3f2","#b98fd6"]
  };
  function hueCss(h){ var c=HUES[h]||HUES.green; return "linear-gradient(150deg,"+c[0]+","+c[1]+")"; }
  function firstName(n){ return (n||"").split(",")[0].split(" ")[0]; }

  /* default (English) content, quote-led and human. Add photo:"file.jpg" any time. */
  var STORIES=[
    {id:"s1",motif:"🎒",hue:"amber",photo:"",h:"Ayesha's lunchbox",quote:"My daughter stopped fading in the afternoons once the juice box went.",name:"Sana, mum of two",b:"Ayesha had a juice box every day and would droop by the afternoon. We swapped it for a water bottle and a little box of grapes. Within a week her teacher said she seemed brighter. She still gets her sweet taste, just from the fruit now."},
    {id:"s2",motif:"🌴",hue:"peach",photo:"",h:"Grandma's dates",quote:"Nobody missed the sweets, and we all slept a little softer.",name:"Marta, grandmother",b:"After dinner everyone reached for sweets. I started setting out a bowl of dates and orange slices instead. Nobody missed the sweets, and we all slept a little softer."},
    {id:"s3",motif:"🚶",hue:"rose",photo:"",h:"The evening walk",quote:"Fifteen minutes after dinner turned into the best part of our day.",name:"Daniel, dad of three",b:"We began a short walk together after dinner, just fifteen minutes. It helped everything settle, and it became the part of the day we all look forward to, side by side and talking."},
    {id:"s4",motif:"🍲",hue:"green",photo:"",h:"Cook once, eat twice",quote:"One big pot on Sunday, and the takeaways almost disappeared.",name:"Priya, mum of four",b:"I started making one big pot of stew on Sundays. With something healthy already in the fridge, we reached for takeaway far less all week."}
  ];
  var TIPS=[
    {id:"t1",motif:"🥗",hue:"green",h:"Fill half your plate",b:"At each meal, aim to make half your plate vegetables or fruit. Colour first, and the rest tends to fall into place."},
    {id:"t2",motif:"💧",hue:"blue",h:"Water before meals",b:"Have a glass of water before you eat. It keeps you hydrated, and thirst can feel a lot like hunger."},
    {id:"t3",motif:"🏷️",hue:"amber",h:"Check the label",b:"Look at sugars per 100g. Around 5g is low, over 22.5g is high. Your scanner does this for you, and it is a handy habit at the shelf too."},
    {id:"t4",motif:"🛒",hue:"peach",h:"Shop the edges",b:"Fresh food usually lines the outer walls of the shop. Shopping the edges quietly fills your basket with real food."},
    {id:"t5",motif:"🍽️",hue:"rose",h:"Slow down",b:"It takes about twenty minutes to feel full. Put the fork down between bites, and let your body catch up."}
  ];
  var PER=2, DAILY=5;

  // Personalise to the chosen community from the shared pack.
  try{
    var _p = window.RFR_pack && RFR_pack();
    if(_p){
      if(_p.stories && _p.stories.length) STORIES=_p.stories;
      if(_p.tips && _p.tips.length) TIPS=_p.tips;
      if(_p.accent){ document.documentElement.style.setProperty("--green",_p.accent); }
    }
  }catch(e){}

  // normalise: give tips a hue/motif fallback, tag types
  STORIES.forEach(function(s){ s._type="story"; s.hue=s.hue||"green"; s.motif=s.motif||"🍽️"; });
  TIPS.forEach(function(t){ t._type="tip"; t.hue=t.hue||"amber"; t.motif=t.motif||"💡"; });
  var ITEMS=STORIES.concat(TIPS);
  var indexOf={}; ITEMS.forEach(function(it,i){ indexOf[it.id]=i; });

  var seen=seenSet();
  setPts(totalPoints());
  function seenCount(){ var c=0; ITEMS.forEach(function(it){ if(seen[it.id]) c++; }); return c; }
  function updateProgress(){ var c=seenCount(),t=ITEMS.length; document.getElementById("pbar").style.width=(c/t*100)+"%"; document.getElementById("ctxt").textContent=c+" / "+t+" read"; }

  function coverInner(it, big){
    return (it.photo?'':'<span class="qmark">“</span>')+
           '<span class="stamp">'+it.motif+'</span>'+
           ((!it.photo && !big && it._type==="story")?'<span class="ph-note">Photo coming soon</span>':'');
  }
  function coverStyle(it){
    return it.photo ? 'background-image:linear-gradient(rgba(0,0,0,.12),rgba(0,0,0,.12)),url('+it.photo+')'
                    : 'background:'+hueCss(it.hue);
  }

  var cardEls={};
  function makeCard(it){
    var el=document.createElement("button"); el.className="scard";
    var body = (it._type==="story" && it.quote)
      ? '<p class="quote">“'+it.quote+'”</p><div class="by">'+it.name+'</div>'+
        '<div class="cue"><span class="go">Read '+firstName(it.name)+'’s story ›</span>'+
        '<span class="rew'+(seen[it.id]?' done':'')+'" data-rt="'+it.id+'">'+(seen[it.id]?'✓ +'+PER:'+'+PER+' ⭐')+'</span></div>'
      : '<h3 class="th">'+it.h+'</h3><p class="tl">'+it.b+'</p>'+
        '<div class="cue"><span class="go">Read tip ›</span>'+
        '<span class="rew'+(seen[it.id]?' done':'')+'" data-rt="'+it.id+'">'+(seen[it.id]?'✓ +'+PER:'+'+PER+' ⭐')+'</span></div>';
    el.innerHTML='<div class="cover" style="'+coverStyle(it)+'">'+coverInner(it)+'</div><div class="body">'+body+'</div>';
    el.onclick=function(){ openReader(indexOf[it.id]); };
    cardEls[it.id]=el; return el;
  }
  function refreshCard(id){ var el=cardEls[id]; if(!el)return; var rt=el.querySelector('[data-rt="'+id+'"]'); if(rt){ rt.textContent="✓ +"+PER; rt.className="rew done"; } }

  /* featured tip/story of the day */
  function dayIndex(){ var d=new Date(); return (d.getFullYear()*372 + d.getMonth()*31 + d.getDate()); }
  var totd=ITEMS[dayIndex()%ITEMS.length];
  var DAY_KEY="rfr_tip_claimed";
  function claimedToday(){ try{return localStorage.getItem(DAY_KEY)===today();}catch(e){return false;} }
  (function(){
    var claimed=claimedToday();
    var f=document.createElement("div"); f.className="scard feature";
    var lead = (totd._type==="story" && totd.quote)
      ? '<p class="quote">“'+totd.quote+'”</p><div class="by">'+totd.name+'</div>'
      : '<h3 class="th">'+totd.h+'</h3><p class="tl">'+totd.b+'</p>';
    f.innerHTML='<div class="cover" style="'+coverStyle(totd)+'"><span class="kick">☀️ Today’s story</span>'+coverInner(totd)+'</div>'+
      '<div class="fbody">'+lead+
      '<div class="claimrow"><span class="txt">Read today’s story to collect your bonus</span>'+
      '<button class="claim'+(claimed?' done':'')+'" id="claimBtn">'+(claimed?'✓ +'+DAILY+' claimed':'Claim +'+DAILY+' ⭐')+'</button></div></div>';
    document.getElementById("feature").appendChild(f);
    f.querySelector(".cover").onclick=function(){ openReader(indexOf[totd.id]); };
    if(!claimed){ document.getElementById("claimBtn").onclick=function(ev){ ev.stopPropagation();
      try{localStorage.setItem(DAY_KEY,today());}catch(e){}
      var nt=award(DAILY,"📖","Story of the day"); setPts(nt);
      var b=document.getElementById("claimBtn"); b.textContent="✓ +"+DAILY+" claimed"; b.className="claim done"; confetti(70); }; }
  })();

  var sh=document.getElementById("stories"); STORIES.forEach(function(s){ sh.appendChild(makeCard(s)); });
  var th=document.getElementById("tips"); TIPS.forEach(function(t){ th.appendChild(makeCard(t)); });
  updateProgress();

  /* immersive reader */
  var reader=document.getElementById("reader"), cur=-1;
  function renderReader(i){
    cur=i; var it=ITEMS[i];
    document.getElementById("rcover").style.cssText=coverStyle(it);
    document.getElementById("rcover").innerHTML=coverInner(it,true)+'<div class="rscrim"></div>';
    document.getElementById("rchip").textContent = it._type==="story" ? "In their words" : "Little tip";
    var earned=false;
    if(!seen[it.id]){ seen[it.id]=1; saveSeen(seen); var nt=award(PER,"📖",it.h||it.name); setPts(nt); refreshCard(it.id); updateProgress(); earned=true; confetti(28); }
    var c=document.getElementById("rcontent");
    c.classList.remove("rswap"); void c.offsetWidth; c.classList.add("rswap");
    var main = (it._type==="story" && it.quote)
      ? '<p class="rquote">“'+it.quote+'”</p><div class="rby">'+it.name+'</div>'+
        '<div class="rbody"><p>'+it.b+'</p></div>'
      : '<p class="rquote">'+it.h+'</p><div class="rbody"><p>'+it.b+'</p></div>';
    c.innerHTML=main+'<div class="rreward">'+(earned?'+'+PER+' points earned ⭐':'✓ Read · +'+PER+' collected')+'</div>';
    document.getElementById("rdots").innerHTML=ITEMS.map(function(_,k){return '<i class="'+(k===i?'on':'')+'"></i>';}).join("");
    document.getElementById("rprev").disabled=i===0;
    document.getElementById("rnext").textContent=i===ITEMS.length-1?"Done ✓":"Next ›";
    c.scrollTop=0;
  }
  function openReader(i){ reader.classList.add("show"); renderReader(i); }
  function closeReader(){ reader.classList.remove("show"); }
  document.getElementById("rclose").onclick=closeReader;
  document.getElementById("rprev").onclick=function(){ if(cur>0) renderReader(cur-1); };
  document.getElementById("rnext").onclick=function(){ if(cur<ITEMS.length-1) renderReader(cur+1); else closeReader(); };
  var sx=0,sy=0;
  reader.addEventListener("touchstart",function(e){sx=e.touches[0].clientX;sy=e.touches[0].clientY;},{passive:true});
  reader.addEventListener("touchend",function(e){var dx=e.changedTouches[0].clientX-sx,dy=e.changedTouches[0].clientY-sy;
    if(Math.abs(dx)>50&&Math.abs(dx)>Math.abs(dy)){ if(dx<0&&cur<ITEMS.length-1)renderReader(cur+1); else if(dx>0&&cur>0)renderReader(cur-1); }},{passive:true});

  /* confetti */
  var fxC=document.getElementById("fx"), fxX=(fxC&&fxC.getContext)?fxC.getContext("2d"):null, Pt=[], raf=null;
  var COL=["#2f9e44","#8fd06a","#e0a100","#e8590c","#4dabf7"];
  function rs(){ if(!fxX)return; fxC.width=window.innerWidth; fxC.height=window.innerHeight; }
  if(fxX){ rs(); window.addEventListener("resize",rs); }
  function confetti(n){ if(!fxX)return; for(var i=0;i<n;i++){Pt.push({x:window.innerWidth/2+(Math.random()*2-1)*80,y:window.innerHeight*0.3,vx:(Math.random()*2-1)*6,vy:-(5+Math.random()*7),g:0.24+Math.random()*0.12,s:5+Math.random()*5,c:COL[(i*7)%COL.length],r:Math.random()*6,vr:(Math.random()*2-1)*0.4,life:1});}
    if(!raf)raf=requestAnimationFrame(tick); }
  function tick(){ fxX.clearRect(0,0,fxC.width,fxC.height);
    for(var i=Pt.length-1;i>=0;i--){var p=Pt[i];p.vy+=p.g;p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;p.life-=0.009;
      if(p.y>fxC.height+24||p.life<=0){Pt.splice(i,1);continue;}
      fxX.save();fxX.globalAlpha=Math.max(0,p.life);fxX.translate(p.x,p.y);fxX.rotate(p.r);fxX.fillStyle=p.c;fxX.fillRect(-p.s/2,-p.s/2,p.s,p.s*0.62);fxX.restore();}
    if(Pt.length)raf=requestAnimationFrame(tick);else{raf=null;fxX.clearRect(0,0,fxC.width,fxC.height);} }
})();
